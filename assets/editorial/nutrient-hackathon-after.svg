    <rect x="245" y="260" width="250" height="22" rx="11" fill="#9ca3af"/>
    <rect x="245" y="310" width="285" height="16" rx="8" fill="#d1d5db"/>
    <rect x="245" y="346" width="255" height="16" rx="8" fill="#d1d5db"/>
    <rect x="245" y="382" width="295" height="16" rx="8" fill="#d1d5db"/>
    <rect x="245" y="455" width="145" height="92" rx="14" fill="#cffafe"/>
    <rect x="410" y="455" width="130" height="92" rx="14" fill="#ede9fe"/>
    <rect x="245" y="585" width="295" height="18" rx="9" fill="#a7f3d0"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M610 435h210" stroke="#64748b" stroke-width="18" opacity="0.5"/>
    <path d="M790 397l48 38-48 38" stroke="#64748b" stroke-width="18" opacity="0.5"/>
  </g>

  <g filter="url(#shadow)">
