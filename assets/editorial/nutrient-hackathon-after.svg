<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Editorial cover for a post-hackathon reflection</title>
  <desc id="desc">A document workflow moving from source evidence through review to a protected final decision, representing verifiable proof, human review, and selective disclosure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="120" r="210" fill="#7c3aed" opacity="0.12"/>
  <circle cx="210" cy="770" r="260" fill="#06b6d4" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="190" y="170" width="390" height="530" rx="28" fill="url(#paper)"/>
