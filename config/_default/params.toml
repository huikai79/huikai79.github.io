# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "Congo"
defaultAppearance = "dark" # valid options: light or dark
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = false

replyByEmail = false

# mainSections = ["section1", "section2"]
# robots = ""

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false
# backgroundImageWidth = 1200

disableThemePreloader = true

# Gate 4B: Hugo's native Open Graph/Twitter templates use site.Params.images
# as the fallback when a page has no article image. Article pages continue to
# inherit Gate 4A `images` front matter and are processed to 1200x630 by the
# local get-page-images helper.
images = ["social-default.png"]

highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = true

fingerprintAlgorithm = "sha512" # Valid values are "sha512" (default), "sha384", "sha256"

giteaDefaultServer = "https://git.fsfe.org"
forgejoDefaultServer = "https://v8.next.forgejo.org"

[header]
  layout = "basic" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing" # Blowfish v3 native personal landing layout
  showRecent = true
  showHomeTitle = false
  showHero = true
  showAllPosts = false
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  layoutBackgroundBlur = true
  disableHeroImageFilter = false

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showAuthorBottom = true
  showIcon = true
  showHero = true
  heroStyle = "background" # valid options: basic, big, background, thumbAndBackground
  layoutBackgroundBlur = false # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = false
  showCategoryOnly = false
  showAuthorsBadges = false
  showWordCount = false
  showComments = false
  showZenMode = false
  sharingLinks = ["facebook", "line", "whatsapp", "telegram", "email"]

# Public Notion articles receive stable showComments/commentKey metadata from
# the visibility-based sync policy. HUIKAI is now the production comment
# provider. Giscus configuration is intentionally retained below as a fast
# rollback path; the pre-cutover inventory found no legacy Giscus discussions.
[comments]
  provider = "huikai"
  apiBase = "/api/comments/v1"
  turnstileSiteKey = "0x4AAAAAAEuog13822T_6ZeU"

[giscus]
  enabled = true
  repo = "huikai79/huikai79.github.io"
  repoId = "R_kgDOPHLqDw"
  category = "技术讨论"
  categoryId = "DIC_kwDOPHLqD84DE7jm"

[list]
  showHero = true
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = false
  showSummary = false
  showViews = false
  showLikes = false
  showTableOfContents = true
  showCards = false
  orderByWeight = false
  groupByYear = true
  cardView = false
  cardViewScreenWidth = false
  constrainItemsWidth = true

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = true
  groupByYear = false
  cardView = false
  cardViewScreenWidth = false

[assetPipeline]

[firebase]

[fathomAnalytics]

# Umami remains intentionally inactive until a real `websiteid` is supplied.
# These options are safe readiness defaults documented by Blowfish v3:
# - only run the tracker on the production domain;
# - do not add automatic track-event attributes to links/buttons.
[umamiAnalytics]
  dataDomains = "huikai.com.kg"
  enableTrackEvent = false

[selineAnalytics]

[buymeacoffee]

[verification]

[rssnext]

[advertisement]
