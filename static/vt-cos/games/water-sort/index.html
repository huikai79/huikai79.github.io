<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VT-COS Water Sort Experiment</title>
<meta name="description" content="VT-COS Water Sort 認知實驗：可驗證遊戲核心、行為證據與個人化提示。">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#432f25;background:#e9c38e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#f8ddb2 0 18%,transparent 55%),repeating-linear-gradient(90deg,rgba(113,65,27,.03) 0 2px,transparent 2px 9px),linear-gradient(#e8bd82,#e4b77b)}button,select{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;background:rgba(255,238,202,.38);box-shadow:0 0 50px rgba(91,55,27,.22)}.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;background:linear-gradient(#7a4c31,#684029);color:#fff4dc;box-shadow:0 4px 12px rgba(80,44,22,.28)}.top a{color:inherit;text-decoration:none;font-size:12px;opacity:.85}.level{font-size:28px;font-weight:600}.top button{justify-self:end;width:40px;height:40px;border:1px solid #ffffff48;border-radius:12px;background:#ffffff18;color:white;cursor:pointer}.hero{text-align:center;padding:18px 16px 4px}.hero h1{margin:0 0 7px;font-size:20px}.budget{font-size:27px;margin:4px 0}.meta{font-size:12px;opacity:.72}.controls{padding:10px 16px}.controls label{display:grid;gap:5px;font-size:12px}.controls select{border:1px solid #50301a33;border-radius:12px;padding:10px 12px;background:#fffaeddb;color:#432f25}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:26px 10px;justify-items:center;align-items:end;min-height:385px;padding:20px 16px 30px}.tube{position:relative;width:52px;height:210px;border:5px solid #6e5747;border-top:0;border-radius:0 0 26px 26px;background:#ffffff2e;cursor:pointer;box-shadow:inset 0 -3px 10px #3c241616;transition:.12s}.tube:before{content:"";position:absolute;left:-6px;right:-6px;top:-5px;height:12px;border:5px solid #6e5747;border-bottom:0;border-radius:9px 9px 0 0}.tube:hover{transform:translateY(-3px)}.tube.sel{transform:translateY(-12px);filter:drop-shadow(0 5px 5px #6335154d)}.stack{position:absolute;left:0;right:0;bottom:0;height:184px;display:flex;flex-direction:column-reverse;overflow:hidden;border-radius:0 0 21px 21px}.liquid{height:46px;flex:0 0 46px;border-top:1px solid #ffffff15}.idx{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:11px;opacity:.5}.actions,.data{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px}.data{grid-template-columns:1fr 1fr;padding-top:4px;padding-bottom:24px}.btn{border:1px solid #50301a2b;border-radius:14px;padding:12px 10px;cursor:pointer;background:#fffaedc7;color:#573c2d}.btn.primary{border:0;background:#6d4630;color:white}.status{min-height:26px;text-align:center;padding:0 16px 10px;font-size:13px;font-weight:600}.boot{text-align:center;padding:0 16px 12px;font-size:11px;opacity:.68}.boot.ok{color:#2f6f42;opacity:.9}.boot.warn{color:#8a3f2a;opacity:.95}.panel{margin:10px 16px;padding:14px;border:1px solid #59382221;border-radius:18px;background:#fff8e8b8}.panel h2{margin:0 0 8px;font-size:14px}.panel p{margin:4px 0;font-size:13px;line-height:1.45}.evi{font:10px ui-monospace,SFMono-Regular,Menlo,monospace!important;opacity:.62;overflow-wrap:anywhere}.claim{display:grid;gap:2px;padding:8px 0;border-bottom:1px dashed #59382229}.claim:last-child{border:0}.claim strong{font-size:12px}.claim span,.muted{font-size:11px!important;opacity:.66}.foot{padding:0 16px 30px;font-size:11px;line-height:1.5;opacity:.62}@media(max-width:520px){.board{grid-template-columns:repeat(6,1fr);gap:24px 6px}.tube{width:44px;height:176px;border-width:4px}.tube:before{left:-5px;right:-5px;border-width:4px}.stack{height:156px}.liquid{height:39px;flex-basis:39px}}@media(max-width:390px){.board{grid-template-columns:repeat(5,1fr)}.tube{width:47px}}
</style>
</head>
<body><main class="app">
<header class="top"><a href="/vt-cos/">← VT-COS EXP</a><div class="level">LV.220</div><button id="restartTop" title="重新開始">↻</button></header>
<section class="hero"><h1>顏色排序認知實驗</h1><p class="budget">剩餘步數：<strong id="budget">42</strong></p><p class="meta">已走 <span id="moves">0</span> 步 · 參考路徑 28 步</p></section>
<section class="controls"><label>實驗模式<select id="mode"><option value="A">A 基準固定提示</option><option value="B">B 規則個人化</option><option value="C" selected>C VT-COS Evidence</option></select></label></section>
<div id="boot" class="boot" role="status">互動載入中…</div><section id="board" class="board" aria-label="Water Sort board"><button type="button" class="tube" aria-label="第 1 管"><div class="stack"><span class="liquid" style="background:#ef7f1a"></span><span class="liquid" style="background:#ef7f1a"></span><span class="liquid" style="background:#df3c3c"></span><span class="liquid" style="background:#55bce6"></span></div><span class="idx">1</span></button><button type="button" class="tube" aria-label="第 2 管"><div class="stack"><span class="liquid" style="background:#7a46b6"></span><span class="liquid" style="background:#55bce6"></span><span class="liquid" style="background:#347b4b"></span><span class="liquid" style="background:#66ba2e"></span></div><span class="idx">2</span></button><button type="button" class="tube" aria-label="第 3 管"><div class="stack"><span class="liquid" style="background:#999baa"></span><span class="liquid" style="background:#ef7f1a"></span><span class="liquid" style="background:#df3c3c"></span><span class="liquid" style="background:#999baa"></span></div><span class="idx">3</span></button><button type="button" class="tube" aria-label="第 4 管"><div class="stack"><span class="liquid" style="background:#347b4b"></span><span class="liquid" style="background:#df3c3c"></span><span class="liquid" style="background:#55bce6"></span><span class="liquid" style="background:#55bce6"></span></div><span class="idx">4</span></button><button type="button" class="tube" aria-label="第 5 管"><div class="stack"><span class="liquid" style="background:#f783a4"></span><span class="liquid" style="background:#999baa"></span><span class="liquid" style="background:#347b4b"></span><span class="liquid" style="background:#2873b6"></span></div><span class="idx">5</span></button><button type="button" class="tube" aria-label="第 6 管"><div class="stack"><span class="liquid" style="background:#f783a4"></span><span class="liquid" style="background:#66ba2e"></span><span class="liquid" style="background:#66ba2e"></span><span class="liquid" style="background:#2873b6"></span></div><span class="idx">6</span></button><button type="button" class="tube" aria-label="第 7 管"><div class="stack"><span class="liquid" style="background:#7a46b6"></span><span class="liquid" style="background:#66ba2e"></span><span class="liquid" style="background:#2873b6"></span><span class="liquid" style="background:#999baa"></span></div><span class="idx">7</span></button><button type="button" class="tube" aria-label="第 8 管"><div class="stack"><span class="liquid" style="background:#ef7f1a"></span><span class="liquid" style="background:#347b4b"></span><span class="liquid" style="background:#f783a4"></span><span class="liquid" style="background:#7a46b6"></span></div><span class="idx">8</span></button><button type="button" class="tube" aria-label="第 9 管"><div class="stack"><span class="liquid" style="background:#f783a4"></span><span class="liquid" style="background:#7a46b6"></span><span class="liquid" style="background:#df3c3c"></span><span class="liquid" style="background:#2873b6"></span></div><span class="idx">9</span></button><button type="button" class="tube" aria-label="第 10 管"><div class="stack"></div><span class="idx">10</span></button><button type="button" class="tube" aria-label="第 11 管"><div class="stack"></div><span class="idx">11</span></button></section><noscript><div class="boot warn">目前瀏覽器沒有執行 JavaScript；可先看到初始棋盤，但無法操作。</div></noscript>
<section class="actions"><button id="undo" class="btn">Undo</button><button id="hint" class="btn primary">提示</button><button id="restart" class="btn">重來</button></section><div id="status" class="status" role="status"></div>
<section class="panel"><h2>Cognitive Adapter</h2><p id="hintText">需要時按「提示」。C 模式會顯示可追溯理由。</p><p id="evidence" class="evi"></p></section>
<section class="panel"><h2>Player Strategy Profile</h2><div id="profile"><p class="muted">尚無足夠行為證據形成策略 claim。</p></div></section>
<section class="data"><button id="export" class="btn">匯出 Evidence</button><button id="clear" class="btn">清除本機資料</button></section>
<p class="foot">Prototype v0.1：Game Core 採 deterministic 規則；Cognitive Adapter 只能提出提示，不能直接修改 GameState。Telemetry 只保存在目前瀏覽器的 localStorage，除非你主動匯出。</p>
</main><script>
(function(){
  var boot=document.getElementById('boot');
  function bootText(text,cls){if(boot){boot.textContent=text;boot.className='boot'+(cls?' '+cls:'');}}
  window.onerror=function(msg,src,line,col){
    bootText('互動核心錯誤：'+String(msg)+' @ '+String(line||'?')+':'+String(col||'?'),'warn');
  };
  bootText('Core 啟動中…');

  var CAP=4;
  var COLORS={O:['橘','#ef7f1a'],R:['紅','#df3c3c'],C:['青','#55bce6'],G:['深綠','#347b4b'],L:['嫩綠','#66ba2e'],P:['紫','#7a46b6'],X:['灰','#999baa'],B:['藍','#2873b6'],K:['粉紅','#f783a4']};
  var INITIAL=[['O','O','R','C'],['P','C','G','L'],['X','O','R','X'],['G','R','C','C'],['K','X','G','B'],['K','L','L','B'],['P','L','B','X'],['O','G','K','P'],['K','P','R','B'],[],[]];
  var BUDGET=42;
  var state=clone(INITIAL),history=[],selected=-1,used=0;
  var EK='vtcos.water-sort.events.core.v1';

  function clone(s){var out=[],i;for(i=0;i<s.length;i++)out.push(s[i].slice());return out;}
  function topInfo(t){
    if(!t.length)return [null,0];
    var c=t[t.length-1],n=1,i;
    for(i=t.length-2;i>=0&&t[i]===c;i--)n++;
    return [c,n];
  }
  function validate(from,to){
    if(from<0||to<0||from>=state.length||to>=state.length)return {ok:false,reason:'索引錯誤'};
    if(from===to)return {ok:false,reason:'來源與目標相同'};
    var a=state[from],b=state[to],info,c,n;
    if(!a.length)return {ok:false,reason:'來源為空'};
    if(b.length>=CAP)return {ok:false,reason:'目標已滿'};
    info=topInfo(a);c=info[0];n=info[1];
    if(b.length&&b[b.length-1]!==c)return {ok:false,reason:'只能倒入空管或相同顏色'};
    n=Math.min(n,CAP-b.length);
    return {ok:true,color:c,amount:n};
  }
  function isSolved(){
    var i,j,t;
    for(i=0;i<state.length;i++){
      t=state[i];
      if(!t.length)continue;
      if(t.length!==CAP)return false;
      for(j=1;j<t.length;j++)if(t[j]!==t[0])return false;
    }
    return true;
  }
  function setStatus(text){var n=document.getElementById('status');if(n)n.textContent=text||'';}
  function record(type,details){
    try{
      var raw=localStorage.getItem(EK),arr=raw?JSON.parse(raw):[];
      arr.push({type:type,details:details||{},at:new Date().toISOString()});
      if(arr.length>300)arr=arr.slice(arr.length-300);
      localStorage.setItem(EK,JSON.stringify(arr));
    }catch(e){}
  }
  function render(){
    var board=document.getElementById('board'),i,j,tube,stack,liq,idx,c;
    if(!board){bootText('互動核心錯誤：找不到 board','warn');return;}
    board.innerHTML='';
    for(i=0;i<state.length;i++){
      tube=document.createElement('button');
      tube.type='button';
      tube.className='tube'+(selected===i?' sel':'');
      tube.setAttribute('aria-label','第 '+(i+1)+' 管');
      tube.setAttribute('data-index',String(i));
      stack=document.createElement('div');stack.className='stack';
      for(j=0;j<state[i].length;j++){
        c=state[i][j];
        liq=document.createElement('span');
        liq.className='liquid';
        liq.style.background=COLORS[c][1];
        liq.title=COLORS[c][0];
        stack.appendChild(liq);
      }
      tube.appendChild(stack);
      idx=document.createElement('span');idx.className='idx';idx.textContent=String(i+1);tube.appendChild(idx);
      tube.onclick=function(){tap(parseInt(this.getAttribute('data-index'),10));};
      board.appendChild(tube);
    }
    document.getElementById('moves').textContent=String(used);
    document.getElementById('budget').textContent=String(BUDGET-used);
  }
  function tap(i){
    var v,from,before,k;
    if(selected<0){
      if(!state[i].length){setStatus('空管不能作為來源。');record('illegal',{from:i,reason:'empty'});return;}
      selected=i;setStatus('已選第 '+(i+1)+' 管');render();return;
    }
    from=selected;selected=-1;v=validate(from,i);
    if(!v.ok){setStatus('這一步不合法：'+v.reason);record('illegal',{from:from,to:i,reason:v.reason});render();return;}
    before=clone(state);history.push(before);
    state[from].splice(state[from].length-v.amount,v.amount);
    for(k=0;k<v.amount;k++)state[i].push(v.color);
    used++;
    record('move',{from:from,to:i,color:v.color,amount:v.amount,move:used});
    if(isSolved())setStatus('完成！共 '+used+' 步。');
    else if(used>BUDGET)setStatus('已超出目標步數，但仍可繼續。');
    else setStatus('');
    render();
  }
  function undo(){
    if(!history.length){setStatus('目前沒有可復原的步驟。');return;}
    state=history.pop();used=Math.max(0,used-1);selected=-1;record('undo',{move:used});setStatus('已復原一步。');render();
  }
  function restart(){
    state=clone(INITIAL);history=[];selected=-1;used=0;record('restart',{});setStatus('已重新開始。');render();
  }
  function firstLegal(){
    var f,t,v;
    for(f=0;f<state.length;f++){
      for(t=0;t<state.length;t++){
        v=validate(f,t);
        if(v.ok&&state[t].length)return {from:f,to:t};
      }
    }
    for(f=0;f<state.length;f++){
      for(t=0;t<state.length;t++){
        v=validate(f,t);
        if(v.ok)return {from:f,to:t};
      }
    }
    return null;
  }
  function hint(){
    var m=firstLegal(),text=document.getElementById('hintText'),mode=document.getElementById('mode').value;
    if(!m){if(text)text.textContent='目前找不到合法移動。';return;}
    if(text)text.textContent='可先試：第 '+(m.from+1)+' 管 → 第 '+(m.to+1)+' 管。';
    record('hint',{mode:mode,from:m.from,to:m.to});
    setStatus('已提供一個合法移動提示。');
  }
  function clearData(){
    try{localStorage.removeItem(EK);}catch(e){}
    setStatus('已清除本機 Core 行為資料。');
  }

  document.getElementById('restartTop').onclick=restart;
  document.getElementById('restart').onclick=restart;
  document.getElementById('undo').onclick=undo;
  document.getElementById('hint').onclick=hint;
  document.getElementById('clear').onclick=clearData;
  document.getElementById('export').onclick=function(){
    var raw='[]';try{raw=localStorage.getItem(EK)||'[]';}catch(e){}
    var blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='vtcos-water-sort-core-evidence.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},0);
  };
  document.getElementById('mode').onchange=function(){setStatus('已切換模式 '+this.value+'；目前 Core 修復版僅記錄模式，不改變遊戲規則。');};

  render();
  bootText('互動核心已就緒','ok');
  record('core_ready',{});
})();
</script></body></html>
