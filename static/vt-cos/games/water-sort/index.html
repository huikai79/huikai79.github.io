<body><main class="app">

</main><script>
var __vtBoot=document.getElementById("boot");
window.onerror=function(msg,src,line,col){
  if(__vtBoot){
    __vtBoot.textContent="互動初始化失敗："+String(msg)+" @ "+String(line||"?")+":"+String(col||"?");
    __vtBoot.className="boot warn";
  }
};
if(__vtBoot){__vtBoot.textContent="JS 基礎執行正常，啟動內嵌遊戲核心…";}
</script><script>
const bootNode=document.getElementById('boot');if(bootNode)bootNode.textContent='Script 已載入，正在初始化…';
const CAP=4,COL={O:['橘','#ef7f1a'],R:['紅','#df3c3c'],C:['青','#55bce6'],G:['深綠','#347b4b'],L:['嫩綠','#66ba2e'],P:['紫','#7a46b6'],X:['灰','#999baa'],B:['藍','#2873b6'],K:['粉紅','#f783a4']};
const INITIAL=[['O','O','R','C'],['P','C','G','L'],['X','O','R','X'],['G','R','C','C'],['K','X','G','B'],['K','L','L','B'],['P','L','B','X'],['O','G','K','P'],['K','P','R','B'],[],[]],BUDGET=42,REF=28;
const $=s=>document.querySelector(s),clone=s=>s.map(t=>t.slice()),key=s=>s.map(t=>t.join(',')).join('|');
function fingerprint(s){let h=0x811c9dc5;for(const ch of key(s)){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)}return `fnv1a32:${(h>>>0).toString(16).padStart(8,'0')}`}
function top(t){if(!t.length)return [null,0];let c=t[t.length-1],n=1;for(let i=t.length-2;i>=0&&t[i]===c;i--)n++;return[c,n]}
function valid(s,f,t){if(!Number.isInteger(f)||!Number.isInteger(t)||f<0||t<0||f>=s.length||t>=s.length)return{ok:false,r:'out_of_range'};if(f===t)return{ok:false,r:'same_tube'};const a=s[f],b=s[t];if(!a.length)return{ok:false,r:'source_empty'};if(b.length>=CAP)return{ok:false,r:'target_full'};const[c,n]=top(a);if(b.length&&b[b.length-1]!==c)return{ok:false,r:'color_mismatch'};return{ok:true,c,n:Math.min(n,CAP-b.length)}}
function apply(s,f,t){const v=valid(s,f,t);if(!v.ok)return{ok:v.ok,r:v.r,c:v.c,n:v.n,state:clone(s)};const n=clone(s);n[f].splice(n[f].length-v.n,v.n);for(let j=0;j<v.n;j++)n[t].push(v.c);return{ok:v.ok,r:v.r,c:v.c,n:v.n,state:n}}
function solved(s){return s.every(t=>!t.length||(t.length===CAP&&t.every(c=>c===t[0])))}
function moves(s){const out=[],empty=s.findIndex(t=>!t.length);for(let f=0;f<s.length;f++)for(let t=0;t<s.length;t++){const v=valid(s,f,t);if(!v.ok)continue;if(!s[t].length&&empty>=0&&t!==empty)continue;if(!s[t].length&&s[f].length===CAP&&s[f].every(c=>c===s[f][0]))continue;out.push({f,t})}return out}
function canon(s){return s.map(t=>t.join(',')).sort().join('|')}function runs(t){let r=t.length?1:0;for(let i=1;i<t.length;i++)if(t[i]!==t[i-1])r++;return r}function heu(s){return Math.max(0,s.reduce((a,t)=>a+runs(t),0)-new Set(s.flat()).size)}
function solve(start,max=120000){if(solved(start))return{ok:true,path:[],exp:0};let q=[{s:clone(start),p:[],g:0,score:heu(start)}],best=new Map([[canon(start),0]]),exp=0;while(q.length&&exp<max){q.sort((a,b)=>a.score-b.score);const n=q.shift();exp++;if(solved(n.s))return{ok:true,path:n.p,exp};for(const m of moves(n.s)){const z=apply(n.s,m.f,m.t).state,g=n.g+1,k=canon(z);if(g>=(best.has(k)?best.get(k):Infinity))continue;best.set(k,g);q.push({s:z,p:n.p.concat([m]),g,score:g+heu(z)})}}return{ok:false,path:[],exp}}
const EK='vtcos.water-sort.events.v1',PK='vtcos.water-sort.player-id.v1',uid=p=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;
const storage=(()=>{try{const k='__vtcos_storage_probe__';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage}catch{const m=new Map();return{getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k)}}})();
function pid(){let x=storage.getItem(PK);if(!x){x=uid('player');storage.setItem(PK,x)}return x}function events(){try{return JSON.parse(storage.getItem(EK)||'[]')}catch{return[]}}
function log(type,action=null,details={},before=null,after=null){const a=events(),e={event_id:uid('evt'),event_type:type,player_id:pid(),session_id:session,level_id:220,state_before_hash:before?fingerprint(before):null,state_after_hash:after?fingerprint(after):null,action,details,occurred_at:new Date().toISOString()};a.push(e);try{storage.setItem(EK,JSON.stringify(a))}catch{}return e}
function profile(){const e=events().filter(x=>['undo','restart','hint','illegal_move','level_complete'].indexOf(x.event_type)>=0),cs=[];const add=(id,text,arr,min)=>{if(arr.length<min)return;const sess=new Set(arr.map(x=>x.session_id)).size,state=arr.length>=4&&sess>=2?'supported':'provisional';cs.push({claim_id:id,claim_text:text,state,confidence:state==='supported'?.82:.58,support_count:arr.length,evidence_event_ids:arr.slice(-12).map(x=>x.event_id)})};add('frequent_undo','經常使用 Undo 回復局面',e.filter(x=>x.event_type==='undo'),2);add('restart_dependency','遇到卡局時偏向重新開始',e.filter(x=>x.event_type==='restart'),2);add('hint_dependency','提示使用頻率偏高',e.filter(x=>x.event_type==='hint'),3);add('rule_friction','常嘗試目前規則不允許的移動',e.filter(x=>x.event_type==='illegal_move'),3);add('route_inefficiency','完成路徑常明顯長於參考路徑',e.filter(x=>x.event_type==='level_complete'&&x.details.moves_used>REF*1.35),2);return{schema:'vtcos-water-sort-strategy-profile-v1',claims:cs,evidence_event_count:e.length}}
let state=clone(INITIAL),hist=[],sel=null,used=0,session=uid('session'),stats={moves:0,undos:0,restarts:0,hints:0,illegal:0};
const reason=r=>({same_tube:'來源與目標相同',source_empty:'來源為空',target_full:'目標已滿',color_mismatch:'目標頂層顏色不同',out_of_range:'索引錯誤'})[r]||r;
function render(){const b=$('#board');b.innerHTML='';state.forEach((t,i)=>{const e=document.createElement('button');e.type='button';e.className='tube'+(sel===i?' sel':'');e.setAttribute('aria-label',`第 ${i+1} 管`);const st=document.createElement('div');st.className='stack';for(const c of t){const q=document.createElement('span');q.className='liquid';q.style.background=COL[c][1];q.title=COL[c][0];st.appendChild(q)}e.appendChild(st);const x=document.createElement('span');x.className='idx';x.textContent=i+1;e.appendChild(x);e.onclick=()=>tap(i);b.appendChild(e)});$('#moves').textContent=used;$('#budget').textContent=BUDGET-used;renderProfile()}
function tap(i){if(sel===null){if(!state[i].length){stats.illegal++;log('illegal_move',{from:i,to:i},{reason:'source_empty'},state,state);$('#status').textContent='空管不能作為來源。';renderProfile();return}sel=i;$('#status').textContent=`已選第 ${i+1} 管`;render();return}const f=sel;sel=null;const v=valid(state,f,i);if(!v.ok){stats.illegal++;log('illegal_move',{from:f,to:i},{reason:v.r},state,state);$('#status').textContent=`這一步不合法：${reason(v.r)}`;render();return}const before=clone(state),r=apply(state,f,i);hist.push(before);state=r.state;used++;stats.moves++;log('move',{from:f,to:i},{amount:r.n,color:r.c,move_number:used},before,state);$('#status').textContent='';if(solved(state)){log('level_complete',null,{moves_used:used,reference_length:REF,delta_from_reference:used-REF,mode:$('#mode').value},before,state);$('#status').textContent=`完成！使用 ${used} 步；參考路徑 ${REF} 步。`}else if(used>BUDGET)$('#status').textContent='已超出目標步數，但仍可繼續完成。';render()}
function restart(){const before=clone(state);stats.restarts++;log('restart',null,{moves_before_restart:used},before,INITIAL);state=clone(INITIAL);hist=[];sel=null;used=0;$('#status').textContent='已重新開始本關。';render()}
function undo(){const x=hist.pop();if(!x)return;const before=clone(state);state=x;used=Math.max(0,used-1);stats.undos++;log('undo',null,{moves_after_undo:used},before,state);$('#status').textContent='已復原一步。';render()}
function hintLevel(mode,p){if(mode==='A')return 3;if(mode==='B')return stats.hints>=2||stats.illegal>=3?3:stats.undos||stats.moves>=8?2:1;const s=new Set(p.claims.filter(x=>x.state==='supported').map(x=>x.claim_id));if(s.has('hint_dependency'))return 1;if(s.has('rule_friction'))return 2;return stats.hints>=2||stats.illegal>=3?3:stats.undos||stats.moves>=7?2:1}
function hint(){const p=profile(),mode=$('#mode').value,r=solve(state);if(!r.ok||!r.path.length){$('#hintText').textContent='目前無法在搜尋上限內找到可靠提示。';return}const m=r.path[0],v=valid(state,m.f,m.t),lv=hintLevel(mode,p),empty=!state[m.t].length,color=COL[v.c][0];let text=lv===1?(empty?'先觀察空管的緩衝價值；現在有一個移動可以騰出後續空間。':`先找能直接合併「${color}」的地方。`):lv===2?(empty?`可考慮利用第 ${m.t+1} 管當緩衝，先移開第 ${m.f+1} 管頂層的「${color}」。`:`下一個有效方向是讓第 ${m.f+1} 管的「${color}」與第 ${m.t+1} 管同色合併。`):`明確提示：把第 ${m.f+1} 管倒到第 ${m.t+1} 管。`;const allIds=[];if(mode==='C'){for(let ci=0;ci<p.claims.length;ci++){for(let ei=0;ei<p.claims[ci].evidence_event_ids.length;ei++)allIds.push(p.claims[ci].evidence_event_ids[ei])}}const ids=mode==='C'?allIds.slice(-8):[],ev=log('hint',{from:m.f,to:m.t},{hint_level:lv,reason_code:mode==='C'?'evidence_backed_profile':mode==='B'?'rule_personalization':'fixed_baseline',evidence_event_ids:ids,solver_expansions:r.exp,mode},state,state);stats.hints++;$('#hintText').textContent=text;$('#evidence').textContent=mode==='C'?`reason=evidence_backed_profile · evidence=${ids.length} · hint_event=${ev.event_id}`:`reason=${mode==='B'?'rule_personalization':'fixed_baseline'}`;renderProfile()}
function renderProfile(){const p=profile(),e=$('#profile');e.innerHTML='';if(!p.claims.length){e.innerHTML='<p class="muted">尚無足夠行為證據形成策略 claim。</p>';return}for(const c of p.claims){const d=document.createElement('div');d.className='claim';d.innerHTML=`<strong>${c.claim_text}</strong><span>${c.state} · confidence ${c.confidence.toFixed(2)} · evidence ${c.support_count}</span>`;e.appendChild(d)}}
function download(){const obj={schema:'vtcos-water-sort-evidence-v1',exported_at:new Date().toISOString(),player_id:pid(),events:events(),strategy_profile:profile()},u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='vtcos-water-sort-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),0)}
$('#restartTop').onclick=$('#restart').onclick=restart;$('#undo').onclick=undo;$('#hint').onclick=hint;$('#export').onclick=download;$('#clear').onclick=()=>{storage.removeItem(EK);$('#status').textContent='已清除本機實驗資料。';renderProfile()};$('#mode').onchange=()=>{$('#status').textContent=`已切換實驗模式 ${$('#mode').value}`;renderProfile()};render();if(bootNode){bootNode.textContent='互動已就緒';bootNode.className='boot ok'}try{log('level_start',null,{mode:$('#mode').value},null,state)}catch(e){$('#status').textContent='遊戲已載入；本機行為紀錄目前不可用。'}
</script></body></html>
