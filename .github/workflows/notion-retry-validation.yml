name: "Notion API retry validation"

on:
  pull_request:
    branches:
      - main
    paths:
      - "sync.mjs"
      - "scripts/check-notion-publication-contract.mjs"
      - "scripts/notion-api-retry.mjs"
      - "scripts/test-notion-api-retry.mjs"
      - ".github/workflows/notion-retry-validation.yml"

permissions:
  contents: read

concurrency:
  group: notion-api-retry-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install locked Notion dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify retry policy and pinned SDK integration
        run: |
          node scripts/test-notion-api-retry.mjs
          node --check scripts/notion-api-retry.mjs
          node --check sync.mjs
          node --check scripts/check-notion-publication-contract.mjs
          node --input-type=module <<'NODE'
          import { Client } from "@notionhq/client";
          import { installNotionApiRetry } from "./scripts/notion-api-retry.mjs";
          const original = Client.prototype.request;
          await installNotionApiRetry({ warn: () => {} });
          if (Client.prototype.request === original) {
            throw new Error("Retry policy was not installed on the pinned Notion SDK Client");
          }
          const installed = Client.prototype.request;
          await installNotionApiRetry({ warn: () => {} });
          if (Client.prototype.request !== installed) {
            throw new Error("Retry policy installation must be idempotent");
          }
          console.log("Pinned Notion SDK retry integration: PASS");
          NODE
