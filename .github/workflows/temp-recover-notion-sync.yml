name: "TEMP recover Notion sync with throttling"

on:
  push:
    branches:
      - recovery/notion-sync-rate-limit-20260915

permissions:
  contents: write

concurrency:
  group: temp-recover-notion-sync-rate-limit-20260915
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record recovery base
        id: base
        run: |
          base_sha="$(git rev-parse HEAD)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Temporary Notion recovery"
            echo ""
            echo "Base main SHA: \`$base_sha\`"
            echo "Repository producer files: **unchanged**"
            echo "Notion request throttling: **runner-only**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify publication contract
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/check-notion-publication-contract.mjs production /tmp/notion-publication-contract.json

      - name: Prepare presentation fingerprints
        run: node scripts/prepare-notion-presentation-fingerprints.mjs /tmp/notion-publication-contract.json /tmp/notion-presentation-fingerprints.json

      - name: Install runner-only Notion throttle
        run: |
          cat > .tmp-notion-throttle.mjs <<'EOF'
          import { Client } from "@notionhq/client";

          const rawRequest = Client.prototype.request;
          let chain = Promise.resolve();
          let nextAllowedAt = 0;

          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

          function retryAfterMs(error, attempt) {
            const header = error?.headers?.get?.("retry-after");
            const seconds = Number(header);
            if (Number.isFinite(seconds) && seconds >= 0) {
              return Math.max(1000, Math.ceil(seconds * 1000) + 500);
            }
            return Math.min(30000, 2000 * (2 ** Math.max(0, attempt - 1)));
          }

          function retryable(error) {
            return error?.code === "rate_limited" || error?.code === "notionhq_client_request_timeout";
          }

          Client.prototype.request = function (...args) {
            const run = async () => {
              const wait = Math.max(0, nextAllowedAt - Date.now());
              if (wait > 0) await delay(wait);

              for (let attempt = 1; attempt <= 6; attempt += 1) {
                nextAllowedAt = Date.now() + 450;
                try {
                  return await rawRequest.apply(this, args);
                } catch (error) {
                  if (!retryable(error) || attempt >= 6) throw error;
                  const pause = retryAfterMs(error, attempt);
                  console.warn(`Notion transient ${error.code}; retry ${attempt}/6 after ${pause}ms`);
                  await delay(pause);
                }
              }
            };

            const current = chain.then(run, run);
            chain = current.catch(() => {});
            return current;
          };
          EOF

      - name: Materialize latest Notion production data with throttled requests
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_SYNC_MODE: production
        run: node --import ./.tmp-notion-throttle.mjs ./sync.mjs

      - name: Enforce deletion quarantine
        run: node scripts/check-sync-deletion-quarantine.mjs .notion-sync-report.json

      - name: Apply editorial metadata and comments policy
        run: |
          python3 scripts/apply-editorial-metadata.py
          python3 scripts/apply-comments-policy.py

      - name: Optimize managed JPEG covers when needed
        run: |
          if python3 scripts/optimize-managed-covers.py --check-needed; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-pil
            python3 scripts/optimize-managed-covers.py
          fi

      - name: Localize multilingual resources
        run: |
          python3 scripts/localize-multilingual-page-resources.py
          python3 scripts/localize-multilingual-page-resources.py --check

      - name: Persist presentation fingerprints
        run: node scripts/finalize-notion-presentation-fingerprints.mjs /tmp/notion-publication-contract.json

      - name: Verify materialized sync state
        run: |
          test -s .notion-sync-report.json
          test -s .notion-sync-manifest.json
          jq -e '.status == "complete" and (.published == .written) and (.written == (.reused + .rebuilt)) and (.deleted | type == "array") and (.pages | type == "array")' .notion-sync-report.json >/dev/null
          test "$(jq -r '.published' .notion-sync-report.json)" -eq "$(jq -r '.pages | length' .notion-sync-manifest.json)"
          test "$(jq -r '.deleted | length' .notion-sync-report.json)" -eq 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Production-equivalent strict validation
        env:
          STRICT_CONTENT: '1'
          REFRESH_HOMEPAGE_ROTATION: '1'
        run: bash scripts/build-and-verify.sh public

      - name: Commit validated synchronized state to main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          rm -f .tmp-notion-throttle.mjs

          current_main="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [ "$current_main" != "$BASE_SHA" ]; then
            echo "::error::main moved during recovery. Expected $BASE_SHA, current $current_main. Refusing to overwrite newer state."
            exit 1
          fi

          git add content/posts data/homepage_runtime.toml .notion-sync-manifest.json .notion-sync-deps.sha256 package-lock.json
          if git diff --cached --quiet; then
            echo "No synchronized state change required."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "🔄 Recover validated Notion site state ($(date -u +"%Y-%m-%dT%H:%M:%SZ"))"
          recovered_sha="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

          {
            echo ""
            echo "## Recovery result"
            echo ""
            echo "Materialized Notion production data: **PASS**"
            echo "Strict build-and-verify: **PASS**"
            echo "Recovered main state: \`$recovered_sha\`"
            echo "Deployment: delegated to normal main sync/deploy pipeline"
          } >> "$GITHUB_STEP_SUMMARY"
