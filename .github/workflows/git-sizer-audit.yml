name: "Repository history size audit"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/git-sizer-audit.yml"

permissions:
  contents: read

concurrency:
  group: git-sizer-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: false

      - name: Install pinned git-sizer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/git-sizer-bin"
          GOBIN="$RUNNER_TEMP/git-sizer-bin" go install github.com/github/git-sizer@v1.5.0
          "$RUNNER_TEMP/git-sizer-bin/git-sizer" --version

      - name: Audit reachable repository history
        run: |
          set -euo pipefail
          SIZER="$RUNNER_TEMP/git-sizer-bin/git-sizer"
          "$SIZER" --names=full | tee git-sizer-summary.txt
          "$SIZER" --verbose --names=full > git-sizer-verbose.txt
          "$SIZER" --json-version=2 --names=full > git-sizer.json

          {
            echo "## git-sizer reachable-history audit"
            echo
            cat git-sizer-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repository-size evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: git-sizer-audit-${{ github.sha }}
          path: |
            git-sizer-summary.txt
            git-sizer-verbose.txt
            git-sizer.json
          retention-days: 14
          if-no-files-found: error
