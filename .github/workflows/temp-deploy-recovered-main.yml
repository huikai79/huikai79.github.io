name: "TEMP deploy recovered main"

on:
  push:
    branches:
      - recovery/notion-sync-rate-limit-20260915

permissions:
  contents: read
  actions: write

concurrency:
  group: temp-deploy-recovered-main-20260915
  cancel-in-progress: true

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovered main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 7426b7fd34796cfc6adf8355204ac6d28161a07b
          fetch-depth: 0
          persist-credentials: false

      - name: Verify recovered SHA is still current main
        env:
          EXPECTED_SHA: 7426b7fd34796cfc6adf8355204ac6d28161a07b
        run: |
          set -euo pipefail
          current_main="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA" || {
            echo "::error::main moved. Expected $EXPECTED_SHA, current $current_main"
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Strict validate committed recovered main
        env:
          STRICT_CONTENT: '1'
          REFRESH_HOMEPAGE_ROTATION: '0'
        run: bash scripts/build-and-verify.sh public

      - name: Dispatch existing exact-main deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 7426b7fd34796cfc6adf8355204ac6d28161a07b
        run: |
          set -euo pipefail
          current_main="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$SOURCE_SHA" || {
            echo "::error::main moved before deployment dispatch. Expected $SOURCE_SHA, current $current_main"
            exit 1
          }

          payload="$(jq -nc --arg ref main --arg sha "$SOURCE_SHA" '{ref:$ref, inputs:{source_sha:$sha}}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d "$payload"

          echo "Deployment dispatched for exact recovered main SHA: $SOURCE_SHA"
