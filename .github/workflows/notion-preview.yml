name: "Notion editorial preview preflight"

on:
  workflow_dispatch:
    inputs:
      staged_page_id:
        description: "Optional Draft + Public Notion page ID to validate without publishing"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notion-editorial-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install locked Notion dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Read Notion preview contract only
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          node scripts/check-notion-publication-contract.mjs preview /tmp/notion-preview-contract.json
          test -s /tmp/notion-preview-contract.json
          jq -e '.status == "pass" and .mode == "preview"' /tmp/notion-preview-contract.json > /dev/null

          {
            echo "## Notion editorial preview"
            echo ""
            echo "Published preview rows: **$(jq -r '.count' /tmp/notion-preview-contract.json)**"
            echo "Published Public rows: **$(jq -r '.productionCount' /tmp/notion-preview-contract.json)**"
            echo "Cover-ready Public rows: **$(jq -r '.coverReadyCount' /tmp/notion-preview-contract.json)**"
            echo "Semantic cover needed: **$(jq -r '.semanticCoverNeededCount' /tmp/notion-preview-contract.json)**"
            echo ""
            echo "This workflow is read-only: it does not write content/posts, the production manifest, main, or deployment state."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate staged Draft + Public page
        if: ${{ inputs.staged_page_id != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          STAGED_PAGE_ID: ${{ inputs.staged_page_id }}
        run: |
          node scripts/check-notion-staged-page.mjs "$STAGED_PAGE_ID" /tmp/notion-staged-page-contract.json
          test -s /tmp/notion-staged-page-contract.json
          jq -e '.status == "pass" and .visibility == "Public" and .notionStatus != "Published"' /tmp/notion-staged-page-contract.json > /dev/null

          {
            echo ""
            echo "### Staged page"
            echo ""
            echo "Title: **$(jq -r '.title' /tmp/notion-staged-page-contract.json)**"
            echo "Slug: \`$(jq -r '.slug' /tmp/notion-staged-page-contract.json)\`"
            echo "Date: **$(jq -r '.date' /tmp/notion-staged-page-contract.json)**"
            echo "Category: **$(jq -r '.category' /tmp/notion-staged-page-contract.json)**"
            echo "Entry type: **$(jq -r '.entryType' /tmp/notion-staged-page-contract.json)**"
            echo "Notion status: **$(jq -r '.notionStatus' /tmp/notion-staged-page-contract.json)**"
            echo "Cover strategy: **$(jq -r '.coverPlan.strategy // "unavailable"' /tmp/notion-staged-page-contract.json)**"
            echo "Publication ready: **$(jq -r '.publicationReady' /tmp/notion-staged-page-contract.json)**"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! jq -e '.publicationReady == true' /tmp/notion-staged-page-contract.json > /dev/null; then
            echo "::warning::Staged page metadata is valid, but a semantic cover should be selected or generated before publication."
          fi

      - name: Prove production files remained untouched
        run: |
          if ! git diff --quiet -- content/posts .notion-sync-manifest.json data/homepage_runtime.toml; then
            echo "::error::Preview workflow modified production-managed files"
            git diff -- content/posts .notion-sync-manifest.json data/homepage_runtime.toml
            exit 1
          fi
