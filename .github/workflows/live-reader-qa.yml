name: "Production live reader QA"

on:
  workflow_run:
    workflows:
      - "Deploy exact main commit to GitHub Pages"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-reader-qa
  cancel-in-progress: true

jobs:
  qa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_SITE_URL: https://huikai.com.kg
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      LIVE_QA_OUTPUT: live-reader-qa
    steps:
      - name: Checkout exact QA script source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: false

      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Allow production edge to settle
        run: sleep 15

      - name: Run live reader QA against production
        run: node scripts/live-reader-qa.mjs

      - name: Upload live QA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: live-reader-qa-${{ env.EXPECTED_SOURCE_SHA }}
          path: live-reader-qa/
          retention-days: 14
          if-no-files-found: warn
