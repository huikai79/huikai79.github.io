name: "TEMP branch-only Notion candidate preflight"

on:
  push:
    branches:
      - rights-no-hero-contract-v1

permissions:
  contents: read

concurrency:
  group: temp-notion-candidate-preflight-rights-no-hero-contract-v1
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: rights-no-hero-contract-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Record candidate lineage
        run: |
          echo "Candidate branch: rights-no-hero-contract-v1"
          echo "Candidate SHA: $(git rev-parse HEAD)"
          {
            echo "## Temporary materialized candidate preflight"
            echo ""
            echo "Candidate branch: \`rights-no-hero-contract-v1\`"
            echo "Candidate SHA: \`$(git rev-parse HEAD)\`"
            echo "Production commit/deployment: **disabled**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install locked Notion sync dependencies
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check runtime and dependency fingerprint
        run: |
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          current_hash="$({
            printf 'node-major=%s\n' "$node_major"
            sha256sum package-lock.json
          } | sha256sum | awk '{print $1}')"
          previous_hash="$(cat .notion-sync-deps.sha256 2>/dev/null || true)"
          printf '%s\n' "$current_hash" > /tmp/notion-sync-deps.sha256
          if [ "$current_hash" != "$previous_hash" ]; then
            echo "Runtime/dependency graph changed; invalidating previous Notion manifest."
            rm -f .notion-sync-manifest.json
          else
            echo "Runtime/dependency graph unchanged; manifest reuse is allowed."
          fi

      - name: Verify publication contract from current Notion production data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/check-notion-publication-contract.mjs production /tmp/notion-publication-contract.json

      - name: Invalidate presentation fingerprints when needed
        run: node scripts/prepare-notion-presentation-fingerprints.mjs /tmp/notion-publication-contract.json /tmp/notion-presentation-fingerprints.json

      - name: Materialize current Notion production data into candidate workspace
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_SYNC_MODE: production
        run: node ./sync.mjs

      - name: Enforce deletion quarantine
        run: node scripts/check-sync-deletion-quarantine.mjs .notion-sync-report.json

      - name: Apply candidate-only editorial metadata cleanup
        run: python3 scripts/apply-editorial-metadata.py

      - name: Apply comments policy
        run: python3 scripts/apply-comments-policy.py

      - name: Optimize oversized managed JPEG covers when needed
        run: |
          if python3 scripts/optimize-managed-covers.py --check-needed; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-pil
            python3 scripts/optimize-managed-covers.py
          else
            echo "Managed cover optimization dependency install skipped."
          fi

      - name: Localize multilingual page resources
        run: |
          python3 scripts/localize-multilingual-page-resources.py
          python3 scripts/localize-multilingual-page-resources.py --check

      - name: Persist candidate presentation fingerprints
        run: node scripts/finalize-notion-presentation-fingerprints.mjs /tmp/notion-publication-contract.json

      - name: Verify materialized sync state
        run: |
          test -s .notion-sync-report.json
          test -s .notion-sync-manifest.json
          jq -e '
            .status == "complete" and
            (.published == .written) and
            (.written == (.reused + .rebuilt)) and
            (.deleted | type == "array") and
            (.pages | type == "array")
          ' .notion-sync-report.json > /dev/null
          published="$(jq -r '.published' .notion-sync-report.json)"
          manifest_count="$(jq -r '.pages | length' .notion-sync-manifest.json)"
          test "$published" -eq "$manifest_count"
          python3 scripts/localize-multilingual-page-resources.py --check
          if python3 scripts/optimize-managed-covers.py --check-needed; then
            echo "::error::Oversized managed JPEG covers remain after candidate optimization"
            exit 1
          fi
          {
            echo ""
            echo "### Materialized Notion state"
            echo ""
            echo "Published: **$published**"
            echo "Reused: **$(jq -r '.reused' .notion-sync-report.json)**"
            echo "Rebuilt: **$(jq -r '.rebuilt' .notion-sync-report.json)**"
            echo "Deleted: **$(jq -r '.deleted | length' .notion-sync-report.json)**"
            echo "Presentation invalidated: **$(jq -r '.invalidated | length' /tmp/notion-presentation-fingerprints.json)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize candidate dependency fingerprint locally
        run: cp /tmp/notion-sync-deps.sha256 .notion-sync-deps.sha256

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Run production-equivalent strict candidate validation
        env:
          STRICT_CONTENT: '1'
          REFRESH_HOMEPAGE_ROTATION: '1'
        run: bash scripts/build-and-verify.sh public

      - name: Report candidate delta without writing repository state
        run: |
          if git diff --quiet -- content/posts data/homepage_runtime.toml .notion-sync-manifest.json .notion-sync-deps.sha256; then
            material_changed=false
          else
            material_changed=true
          fi
          {
            echo ""
            echo "### Result"
            echo ""
            echo "Materialized latest Notion production data: **PASS**"
            echo "Production-equivalent build-and-verify: **PASS**"
            echo "Material state differs from committed branch snapshot: **$material_changed**"
            echo "Repository commit: **SKIPPED**"
            echo "Deployment: **SKIPPED**"
            echo "Generated candidate state exists only in this ephemeral runner."
          } >> "$GITHUB_STEP_SUMMARY"
