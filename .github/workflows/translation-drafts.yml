name: "Notion translation draft preflight"

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create missing translation drafts in Notion (uses paid model API when true)"
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows:
      - "Notion sync -> validated main commit"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: notion-translation-drafts
  cancel-in-progress: false

jobs:
  translate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify translation draft contracts
        run: |
          node scripts/verify-translation-draft-contract.mjs
          node --check scripts/transmith-runtime-profile.mjs
          node --check scripts/generate-translation-drafts.mjs

      - name: Preflight translation plan or create manually approved drafts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: gpt-5.6-luna
          # Sync-triggered runs are observability/preflight only. Paid model use
          # and Notion writes require an explicit workflow_dispatch apply=true.
          TRANSLATION_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && '1' || '0' }}
          TRANSLATION_REPORT_PATH: /tmp/notion-translation-drafts.json
        run: node scripts/generate-translation-drafts.mjs

      - name: Report translation result
        if: always()
        run: |
          if [ -s /tmp/notion-translation-drafts.json ]; then
            jq '{status,apply,provider,model,translationProfile,sourceCount,requestedTargetCount,planned,generated,skipped,blocked}' /tmp/notion-translation-drafts.json
          else
            echo "Translation report was not created."
          fi
