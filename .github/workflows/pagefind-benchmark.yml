name: "Pagefind search benchmark"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pagefind-benchmark.yml"
      - "content/**"
      - "layouts/**"
      - "config/**"
      - "scripts/article_routing.py"
      - ".notion-sync-manifest.json"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagefind-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Build verified HUIKAI candidate
        run: bash scripts/build-and-verify.sh public

      - name: Prepare equivalent article corpus
        run: |
          set -euo pipefail
          rm -rf pagefind-corpus
          mkdir -p pagefind-corpus

          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from article_routing import routes

          public = Path("public")
          corpus = Path("pagefind-corpus")
          route_list = routes()
          expected = {route.permalink_path for route in route_list}

          index_files = {
              "zh-TW": public / "index.json",
              "zh-CN": public / "zh-cn" / "index.json",
              "en": public / "en" / "index.json",
          }

          by_language = {}
          fuse_articles_by_language = {}
          fuse_full_by_language = {}

          for language in sorted({route.language for route in route_list}):
              index_file = index_files[language]
              if not index_file.is_file():
                  raise SystemExit(f"Fuse language index missing: {language} -> {index_file}")
              fuse = json.loads(index_file.read_text(encoding="utf-8"))
              language_routes = [route for route in route_list if route.language == language]
              language_expected = {route.permalink_path for route in language_routes}
              fuse_articles = [
                  item for item in fuse
                  if str(item.get("permalink", "")) in language_expected
              ]
              actual = {str(item.get("permalink", "")) for item in fuse_articles}
              missing = sorted(language_expected - actual)
              unexpected = sorted(actual - language_expected)
              if missing or unexpected or len(fuse_articles) != len(language_routes):
                  raise SystemExit(
                      f"Fuse/article routing mismatch for {language}: "
                      f"routes={len(language_routes)} fuse_articles={len(fuse_articles)} "
                      f"missing={missing} unexpected={unexpected}"
                  )
              fuse_articles_by_language[language] = fuse_articles
              fuse_full_by_language[language] = fuse

          (Path("fuse-articles-by-language.json")).write_text(
              json.dumps(fuse_articles_by_language, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          (Path("fuse-full-by-language.json")).write_text(
              json.dumps(fuse_full_by_language, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          for route in route_list:
              source = route.rendered(public)
              if not source.is_file():
                  raise SystemExit(f"Rendered article missing: {source}")
              rel = source.relative_to(public)
              target = corpus / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              by_language[route.language] = by_language.get(route.language, 0) + 1

          Path("article-corpus-summary.json").write_text(
              json.dumps(
                  {
                      "routes": len(route_list),
                      "languages": by_language,
                      "paths": sorted(expected),
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          print(f"Equivalent article corpus: {len(route_list)} routes / {by_language}")
          PY

      - name: Record equivalent Blowfish Fuse metrics
        run: |
          set -euo pipefail
          test -s fuse-articles-by-language.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import gzip
          import json
          from pathlib import Path

          article_map = json.loads(Path("fuse-articles-by-language.json").read_text(encoding="utf-8"))
          full_map = json.loads(Path("fuse-full-by-language.json").read_text(encoding="utf-8"))

          def packed(value):
              return (json.dumps(value, ensure_ascii=False, separators=(",", ":")) + "\n").encode("utf-8")

          totals = {"article_docs": 0, "article_raw": 0, "article_gzip": 0}
          for language, docs in sorted(article_map.items()):
              raw = packed(docs)
              gz = gzip.compress(raw)
              key = language.upper().replace("-", "_")
              print(f"FUSE_{key}_ARTICLE_DOCUMENTS={len(docs)}")
              print(f"FUSE_{key}_ARTICLE_BYTES={len(raw)}")
              print(f"FUSE_{key}_ARTICLE_GZIP_BYTES={len(gz)}")
              totals["article_docs"] += len(docs)
              totals["article_raw"] += len(raw)
              totals["article_gzip"] += len(gz)

          print(f"FUSE_ARTICLE_DOCUMENTS_TOTAL={totals['article_docs']}")
          print(f"FUSE_ARTICLE_BYTES_TOTAL={totals['article_raw']}")
          print(f"FUSE_ARTICLE_GZIP_BYTES_TOTAL={totals['article_gzip']}")
          PY

      - name: Build pinned Pagefind index from equivalent article corpus
        run: |
          set -euo pipefail
          npx --yes pagefind@1.5.2 --site pagefind-corpus 2>&1 | tee pagefind-build.log
          test -d pagefind-corpus/pagefind
          test -s pagefind-corpus/pagefind/pagefind.js

      - name: Record Pagefind artifact metrics
        run: |
          set -euo pipefail
          pagefind_bytes="$(du -sb pagefind-corpus/pagefind | cut -f1)"
          pagefind_files="$(find pagefind-corpus/pagefind -type f | wc -l)"
          pagefind_gzip_bytes="$(tar -C pagefind-corpus -cf - pagefind | gzip -c | wc -c)"
          {
            echo "PAGEFIND_BYTES=$pagefind_bytes"
            echo "PAGEFIND_FILES=$pagefind_files"
            echo "PAGEFIND_GZIP_TAR_BYTES=$pagefind_gzip_bytes"
          } >> "$GITHUB_ENV"

      - name: Install pinned query benchmark runtimes
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund fuse.js@7.5.0 playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Compare known-answer query relevance
        run: |
          set -euo pipefail
          cat > pagefind-corpus/benchmark-zh-tw.html <<'HTML'
          <!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><title>benchmark</title></head><body></body></html>
          HTML
          mkdir -p pagefind-corpus/zh-cn
          cat > pagefind-corpus/zh-cn/benchmark.html <<'HTML'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>benchmark</title></head><body></body></html>
          HTML

          python3 -m http.server 4178 --directory pagefind-corpus >/tmp/pagefind-benchmark-http.log 2>&1 &
          echo $! >/tmp/pagefind-benchmark-http.pid
          for _ in $(seq 1 20); do
            curl --fail --silent --show-error http://127.0.0.1:4178/benchmark-zh-tw.html >/dev/null && break
            sleep 1
          done

          cat > /tmp/search-benchmark.mjs <<'JS'
          import fs from "node:fs";
          import Fuse from "fuse.js";
          import { chromium } from "playwright";

          const corpus = JSON.parse(fs.readFileSync("fuse-articles-by-language.json", "utf8"));
          const cases = [
            { language: "zh-TW", query: "小寫 b", expected: "/posts/small-b-blogging/" },
            { language: "zh-TW", query: "知識之河", expected: "/posts/my-website-is-a-shifting-house/" },
            { language: "zh-TW", query: "無為農法", expected: "/posts/how-to-grow-an-idea/" },
            { language: "zh-TW", query: "寫作 思考", expected: "/posts/writes-and-write-nots/" },
            { language: "zh-TW", query: "small b blogging", expected: "/posts/small-b-blogging/" },
            { language: "zh-CN", query: "小写 b", expected: "/zh-cn/posts/small-b-blogging/" },
            { language: "zh-CN", query: "世界模型", expected: "/zh-cn/posts/how-you-know/" },
            { language: "zh-CN", query: "新创公司", expected: "/zh-cn/posts/be-alife/" },
            { language: "zh-CN", query: "small b blogging", expected: "/zh-cn/posts/small-b-blogging/" },
          ];

          const fuseOptions = {
            shouldSort: true,
            ignoreLocation: true,
            threshold: 0.0,
            includeMatches: true,
            keys: [
              { name: "title", weight: 0.8 },
              { name: "section", weight: 0.2 },
              { name: "summary", weight: 0.6 },
              { name: "content", weight: 0.4 },
            ],
          };

          const fuseByLanguage = new Map(
            Object.entries(corpus).map(([language, docs]) => [language, new Fuse(docs, fuseOptions)])
          );

          const browser = await chromium.launch({ headless: true });
          const rows = [];
          try {
            for (const test of cases) {
              const fuse = fuseByLanguage.get(test.language);
              if (!fuse) throw new Error(`Missing Fuse corpus for ${test.language}`);
              const fuseUrls = fuse.search(test.query, { limit: 5 }).map(result =>
                String(result.item.permalink || "").toLowerCase()
              );

              const page = await browser.newPage();
              let pagefindBytes = 0;
              page.on("response", async response => {
                if (!response.url().includes("/pagefind/")) return;
                try {
                  const body = await response.body();
                  pagefindBytes += body.length;
                } catch {}
              });

              const harness = test.language === "zh-CN"
                ? "http://127.0.0.1:4178/zh-cn/benchmark.html"
                : "http://127.0.0.1:4178/benchmark-zh-tw.html";
              await page.goto(harness, { waitUntil: "domcontentloaded" });

              const pagefindUrls = await page.evaluate(async query => {
                const pagefind = await import("/pagefind/pagefind.js");
                await pagefind.init();
                const search = await pagefind.search(query);
                const loaded = await Promise.all(search.results.slice(0, 5).map(result => result.data()));
                return loaded.map(result => String(result.url || "").toLowerCase());
              }, test.query);

              const normalize = value => {
                const clean = String(value || "").split("#", 1)[0].split("?", 1)[0].toLowerCase();
                return clean.endsWith("/") ? clean : clean + "/";
              };
              const expected = normalize(test.expected);
              const fuseRank = fuseUrls.map(normalize).findIndex(url => url === expected);
              const pagefindRank = pagefindUrls.map(normalize).findIndex(url => url === expected);

              rows.push({
                ...test,
                fuseTop5: fuseUrls,
                pagefindTop5: pagefindUrls,
                fuseTop3Hit: fuseRank >= 0 && fuseRank < 3,
                pagefindTop3Hit: pagefindRank >= 0 && pagefindRank < 3,
                fuseRank: fuseRank >= 0 ? fuseRank + 1 : null,
                pagefindRank: pagefindRank >= 0 ? pagefindRank + 1 : null,
                pagefindColdBytes: pagefindBytes,
              });
              await page.close();
            }
          } finally {
            await browser.close();
          }

          const summary = {
            cases: rows.length,
            fuseTop3Hits: rows.filter(row => row.fuseTop3Hit).length,
            pagefindTop3Hits: rows.filter(row => row.pagefindTop3Hit).length,
            pagefindColdBytesMedian: rows
              .map(row => row.pagefindColdBytes)
              .sort((a, b) => a - b)[Math.floor(rows.length / 2)],
          };

          fs.writeFileSync(
            "search-query-benchmark.json",
            JSON.stringify({ summary, rows }, null, 2) + "\n",
            "utf8"
          );

          const md = [
            "# Query relevance benchmark",
            "",
            `- Cases: **${summary.cases}**`,
            `- Fuse Top-3 known-answer hits: **${summary.fuseTop3Hits}/${summary.cases}**`,
            `- Pagefind Top-3 known-answer hits: **${summary.pagefindTop3Hits}/${summary.cases}**`,
            `- Median cold Pagefind asset/index bytes observed by Chromium: **${summary.pagefindColdBytesMedian}**`,
            "",
            "| Language | Query | Expected | Fuse rank | Pagefind rank | Pagefind cold bytes |",
            "|---|---|---|---:|---:|---:|",
            ...rows.map(row =>
              `| ${row.language} | ${row.query} | ${row.expected} | ${row.fuseRank ?? "—"} | ${row.pagefindRank ?? "—"} | ${row.pagefindColdBytes} |`
            ),
            "",
          ].join("\n");
          fs.writeFileSync("search-query-benchmark.md", md, "utf8");
          console.log(md);
          JS

          node /tmp/search-benchmark.mjs
          cat search-query-benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write benchmark summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          corpus = json.loads(Path("article-corpus-summary.json").read_text(encoding="utf-8"))
          languages = ", ".join(
              f"{key}: {value}" for key, value in sorted(corpus["languages"].items())
          )
          lines = [
              "# HUIKAI search benchmark",
              "",
              "This experiment does not replace the production Blowfish/Fuse search UI.",
              "",
              "## Equivalent article corpus",
              "",
              f"- Routed article pages: **{corpus['routes']}**",
              f"- Language distribution: **{languages}**",
              "",
              "## Blowfish/Fuse — same article corpus",
              "",
              f"- Total article documents: **{os.environ['FUSE_ARTICLE_DOCUMENTS_TOTAL']}**",
              f"- Sum of per-language raw JSON bytes: **{os.environ['FUSE_ARTICLE_BYTES_TOTAL']}**",
              f"- Sum of per-language gzip bytes: **{os.environ['FUSE_ARTICLE_GZIP_BYTES_TOTAL']}**",
              f"- zh-TW: **{os.environ.get('FUSE_ZH_TW_ARTICLE_DOCUMENTS', '0')} docs / {os.environ.get('FUSE_ZH_TW_ARTICLE_GZIP_BYTES', '0')} gzip bytes**",
              f"- zh-CN: **{os.environ.get('FUSE_ZH_CN_ARTICLE_DOCUMENTS', '0')} docs / {os.environ.get('FUSE_ZH_CN_ARTICLE_GZIP_BYTES', '0')} gzip bytes**",
              "",
              "## Pagefind 1.5.2 — same article corpus",
              "",
              f"- Total generated index bytes: **{os.environ['PAGEFIND_BYTES']}**",
              f"- Generated files: **{os.environ['PAGEFIND_FILES']}**",
              f"- Gzipped tar size of generated bundle: **{os.environ['PAGEFIND_GZIP_TAR_BYTES']}**",
              "",
              "## Interpretation boundary",
              "",
              "Generated Pagefind bundle size is not equivalent to browser transfer. "
              "Fuse fetches the article JSON corpus as one payload; Pagefind fetches language/index chunks on demand. "
              "A browser/query benchmark is required before any replacement decision.",
              "",
          ]
          Path("pagefind-benchmark-summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          cat pagefind-benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pagefind benchmark evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pagefind-benchmark-${{ github.sha }}
          path: |
            pagefind-benchmark-summary.md
            pagefind-build.log
            search-query-benchmark.json
            search-query-benchmark.md
            article-corpus-summary.json
            fuse-articles-by-language.json
            fuse-full-by-language.json
            pagefind-corpus/pagefind/
          retention-days: 14
          if-no-files-found: error
