name: "Pagefind search benchmark"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pagefind-benchmark.yml"
      - "content/**"
      - "layouts/**"
      - "config/**"
      - "scripts/article_routing.py"
      - ".notion-sync-manifest.json"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagefind-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Build verified HUIKAI candidate
        run: bash scripts/build-and-verify.sh public

      - name: Prepare equivalent article corpus
        run: |
          set -euo pipefail
          rm -rf pagefind-corpus
          mkdir -p pagefind-corpus

          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from article_routing import routes

          public = Path("public")
          corpus = Path("pagefind-corpus")
          route_list = routes()
          expected = {route.permalink_path for route in route_list}

          index_files = {
              "zh-TW": public / "index.json",
              "zh-CN": public / "zh-cn" / "index.json",
              "en": public / "en" / "index.json",
          }

          by_language = {}
          fuse_articles_by_language = {}
          fuse_full_by_language = {}

          for language in sorted({route.language for route in route_list}):
              index_file = index_files[language]
              if not index_file.is_file():
                  raise SystemExit(f"Fuse language index missing: {language} -> {index_file}")
              fuse = json.loads(index_file.read_text(encoding="utf-8"))
              language_routes = [route for route in route_list if route.language == language]
              language_expected = {route.permalink_path for route in language_routes}
              fuse_articles = [
                  item for item in fuse
                  if str(item.get("permalink", "")) in language_expected
              ]
              actual = {str(item.get("permalink", "")) for item in fuse_articles}
              missing = sorted(language_expected - actual)
              unexpected = sorted(actual - language_expected)
              if missing or unexpected or len(fuse_articles) != len(language_routes):
                  raise SystemExit(
                      f"Fuse/article routing mismatch for {language}: "
                      f"routes={len(language_routes)} fuse_articles={len(fuse_articles)} "
                      f"missing={missing} unexpected={unexpected}"
                  )
              fuse_articles_by_language[language] = fuse_articles
              fuse_full_by_language[language] = fuse

          (Path("fuse-articles-by-language.json")).write_text(
              json.dumps(fuse_articles_by_language, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          (Path("fuse-full-by-language.json")).write_text(
              json.dumps(fuse_full_by_language, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          for route in route_list:
              source = route.rendered(public)
              if not source.is_file():
                  raise SystemExit(f"Rendered article missing: {source}")
              rel = source.relative_to(public)
              target = corpus / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              by_language[route.language] = by_language.get(route.language, 0) + 1

          Path("article-corpus-summary.json").write_text(
              json.dumps(
                  {
                      "routes": len(route_list),
                      "languages": by_language,
                      "paths": sorted(expected),
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          print(f"Equivalent article corpus: {len(route_list)} routes / {by_language}")
          PY

      - name: Record equivalent Blowfish Fuse metrics
        run: |
          set -euo pipefail
          test -s fuse-articles-by-language.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import gzip
          import json
          from pathlib import Path

          article_map = json.loads(Path("fuse-articles-by-language.json").read_text(encoding="utf-8"))
          full_map = json.loads(Path("fuse-full-by-language.json").read_text(encoding="utf-8"))

          def packed(value):
              return (json.dumps(value, ensure_ascii=False, separators=(",", ":")) + "\n").encode("utf-8")

          totals = {"article_docs": 0, "article_raw": 0, "article_gzip": 0}
          for language, docs in sorted(article_map.items()):
              raw = packed(docs)
              gz = gzip.compress(raw)
              key = language.upper().replace("-", "_")
              print(f"FUSE_{key}_ARTICLE_DOCUMENTS={len(docs)}")
              print(f"FUSE_{key}_ARTICLE_BYTES={len(raw)}")
              print(f"FUSE_{key}_ARTICLE_GZIP_BYTES={len(gz)}")
              totals["article_docs"] += len(docs)
              totals["article_raw"] += len(raw)
              totals["article_gzip"] += len(gz)

          print(f"FUSE_ARTICLE_DOCUMENTS_TOTAL={totals['article_docs']}")
          print(f"FUSE_ARTICLE_BYTES_TOTAL={totals['article_raw']}")
          print(f"FUSE_ARTICLE_GZIP_BYTES_TOTAL={totals['article_gzip']}")
          PY

      - name: Build pinned Pagefind index from equivalent article corpus
        run: |
          set -euo pipefail
          npx --yes pagefind@1.5.2 --site pagefind-corpus 2>&1 | tee pagefind-build.log
          test -d pagefind-corpus/pagefind
          test -s pagefind-corpus/pagefind/pagefind.js

      - name: Record Pagefind artifact metrics
        run: |
          set -euo pipefail
          pagefind_bytes="$(du -sb pagefind-corpus/pagefind | cut -f1)"
          pagefind_files="$(find pagefind-corpus/pagefind -type f | wc -l)"
          pagefind_gzip_bytes="$(tar -C pagefind-corpus -cf - pagefind | gzip -c | wc -c)"
          {
            echo "PAGEFIND_BYTES=$pagefind_bytes"
            echo "PAGEFIND_FILES=$pagefind_files"
            echo "PAGEFIND_GZIP_TAR_BYTES=$pagefind_gzip_bytes"
          } >> "$GITHUB_ENV"

      - name: Write benchmark summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          corpus = json.loads(Path("article-corpus-summary.json").read_text(encoding="utf-8"))
          languages = ", ".join(
              f"{key}: {value}" for key, value in sorted(corpus["languages"].items())
          )
          lines = [
              "# HUIKAI search benchmark",
              "",
              "This experiment does not replace the production Blowfish/Fuse search UI.",
              "",
              "## Equivalent article corpus",
              "",
              f"- Routed article pages: **{corpus['routes']}**",
              f"- Language distribution: **{languages}**",
              "",
              "## Blowfish/Fuse — same article corpus",
              "",
              f"- Total article documents: **{os.environ['FUSE_ARTICLE_DOCUMENTS_TOTAL']}**",
              f"- Sum of per-language raw JSON bytes: **{os.environ['FUSE_ARTICLE_BYTES_TOTAL']}**",
              f"- Sum of per-language gzip bytes: **{os.environ['FUSE_ARTICLE_GZIP_BYTES_TOTAL']}**",
              f"- zh-TW: **{os.environ.get('FUSE_ZH_TW_ARTICLE_DOCUMENTS', '0')} docs / {os.environ.get('FUSE_ZH_TW_ARTICLE_GZIP_BYTES', '0')} gzip bytes**",
              f"- zh-CN: **{os.environ.get('FUSE_ZH_CN_ARTICLE_DOCUMENTS', '0')} docs / {os.environ.get('FUSE_ZH_CN_ARTICLE_GZIP_BYTES', '0')} gzip bytes**",
              "",
              "## Pagefind 1.5.2 — same article corpus",
              "",
              f"- Total generated index bytes: **{os.environ['PAGEFIND_BYTES']}**",
              f"- Generated files: **{os.environ['PAGEFIND_FILES']}**",
              f"- Gzipped tar size of generated bundle: **{os.environ['PAGEFIND_GZIP_TAR_BYTES']}**",
              "",
              "## Interpretation boundary",
              "",
              "Generated Pagefind bundle size is not equivalent to browser transfer. "
              "Fuse fetches the article JSON corpus as one payload; Pagefind fetches language/index chunks on demand. "
              "A browser/query benchmark is required before any replacement decision.",
              "",
          ]
          Path("pagefind-benchmark-summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          cat pagefind-benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pagefind benchmark evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pagefind-benchmark-${{ github.sha }}
          path: |
            pagefind-benchmark-summary.md
            pagefind-build.log
            article-corpus-summary.json
            fuse-articles-by-language.json
            fuse-full-by-language.json
            pagefind-corpus/pagefind/
          retention-days: 14
          if-no-files-found: error
