name: "Notion sync -> validated main commit"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Synchronization caller: manual, health, manual-health, or weekly-presentation"
        required: false
        default: "manual"
        type: string
      preflight_only:
        description: "Materialize and validate the latest Notion production candidate without committing or deploying"
        required: false
        default: false
        type: boolean
      candidate_ref:
        description: "Repository ref to validate in preflight mode; workflow itself must still be dispatched from main"
        required: false
        default: "main"
        type: string
      force_deploy:
        description: "Force an exact-main redeployment after validation even when the site surface did not change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ inputs.preflight_only == true && format('notion-preflight-{0}', inputs.candidate_ref) || 'notion-sync-main' }}
  cancel-in-progress: ${{ github.event_name == 'push' || inputs.preflight_only == true }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce trusted synchronization entrypoint
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Synchronization and preflight orchestration must run from the trusted main workflow definition. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.preflight_only == true && inputs.candidate_ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record candidate lineage
        id: candidate
        env:
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Candidate lineage"
            echo ""
            echo "Mode: **$([ "$PREFLIGHT_ONLY" = "true" ] && echo preflight || echo synchronization)**"
            echo "Requested ref: \`${CANDIDATE_REF:-main}\`"
            echo "Candidate SHA: \`$candidate_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install locked Notion sync dependencies
        run: |
          test -s package-lock.json || {
            echo "::error::package-lock.json is required"
            exit 1
          }
          npm ci --ignore-scripts --no-audit --no-fund
          node --version
          npm --version
          npm ls --depth=0 '@notionhq/client' notion-to-md p-limit node-fetch

      - name: Check runtime and dependency fingerprint
        run: |
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          current_hash="$({
            printf 'node-major=%s\n' "$node_major"
            sha256sum package-lock.json
          } | sha256sum | awk '{print $1}')"
          previous_hash="$(cat .notion-sync-deps.sha256 2>/dev/null || true)"
          printf '%s\n' "$current_hash" > /tmp/notion-sync-deps.sha256

          if [ "$current_hash" != "$previous_hash" ]; then
            echo "Runtime or dependency graph changed; invalidating previous Notion manifest."
            rm -f .notion-sync-manifest.json
          else
            echo "Runtime/dependency graph unchanged; manifest reuse is allowed."
          fi

      - name: Verify publication contract without writing production content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/check-notion-publication-contract.mjs production /tmp/notion-publication-contract.json

      - name: Summarize publication contract evidence
        if: ${{ always() }}
        run: |
          if [ ! -s /tmp/notion-publication-contract.json ]; then
            echo "Publication contract report was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Publication contract"
            echo ""
            echo "Status: **$(jq -r '.status' /tmp/notion-publication-contract.json)**"
            echo "Production rows: **$(jq -r '.productionCount' /tmp/notion-publication-contract.json)**"
            echo ""
            if [ "$(jq -r '.status' /tmp/notion-publication-contract.json)" != "pass" ]; then
              echo "### Blocking issues"
              echo ""
              jq -r '.failures[] | "- " + .' /tmp/notion-publication-contract.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: notion-publication-contract-${{ github.run_id }}
          path: /tmp/notion-publication-contract.json
          retention-days: 14
          if-no-files-found: warn

      - name: Invalidate bundles when Notion cover or icon changed
        run: node scripts/prepare-notion-presentation-fingerprints.mjs /tmp/notion-publication-contract.json /tmp/notion-presentation-fingerprints.json

      - name: Sync Notion into candidate snapshot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_SYNC_MODE: production
        run: node ./sync.mjs

      - name: Enforce deletion quarantine
        run: node scripts/check-sync-deletion-quarantine.mjs .notion-sync-report.json

      - name: Project Notion last-edited timestamps into article metadata
        run: python3 scripts/apply-editorial-metadata.py

      - name: Apply comments policy
        run: python3 scripts/apply-comments-policy.py

      - name: Optimize oversized managed JPEG covers when needed
        run: |
          if python3 scripts/optimize-managed-covers.py --check-needed; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-pil
            python3 -c 'from PIL import Image; print("Pillow runtime:", Image.__version__)'
            python3 scripts/optimize-managed-covers.py
          else
            echo "Managed cover optimization dependency install skipped."
          fi

      - name: Localize multilingual page resources
        run: |
          python3 scripts/localize-multilingual-page-resources.py
          python3 scripts/localize-multilingual-page-resources.py --check

      - name: Persist Notion cover and icon fingerprints
        run: node scripts/finalize-notion-presentation-fingerprints.mjs /tmp/notion-publication-contract.json

      - name: Verify sync report and article bundles
        run: |
          test -s .notion-sync-report.json
          test -s .notion-sync-manifest.json
          jq -e '
            .status == "complete" and
            (.published == .written) and
            (.written == (.reused + .rebuilt)) and
            (.deleted | type == "array") and
            (.pages | type == "array")
          ' .notion-sync-report.json > /dev/null

          published="$(jq -r '.published' .notion-sync-report.json)"
          written="$(jq -r '.written' .notion-sync-report.json)"
          manifest_count="$(jq -r '.pages | length' .notion-sync-manifest.json)"
          bundle_count=0

          while IFS=$'\t' read -r bundle_path content_file; do
            if [ -z "$bundle_path" ] || [ -z "$content_file" ] || [ "$content_file" = "null" ]; then
              echo "::error::Notion manifest article is missing bundlePath/slug/contentFile"
              exit 1
            fi
            article_source="content/posts/${bundle_path}/${content_file}"
            if [ ! -s "$article_source" ]; then
              echo "::error::Manifest article source is missing: $article_source"
              exit 1
            fi
            bundle_count=$((bundle_count + 1))
          done < <(jq -r '.pages[] | [(.bundlePath // .slug), .contentFile] | @tsv' .notion-sync-manifest.json)

          test "$published" -eq "$written"
          test "$written" -eq "$bundle_count"
          test "$published" -eq "$manifest_count"
          test -s content/posts/_index.md
          test -s content/posts/_index.zh-cn.md

          if python3 scripts/optimize-managed-covers.py --check-needed; then
            echo "::error::Oversized managed JPEG covers remain after the optimization stage"
            exit 1
          fi

          python3 scripts/localize-multilingual-page-resources.py --check

          if find content -maxdepth 1 -type d \( -name '.posts-staging-*' -o -name '.posts-backup-*' \) | grep -q .; then
            echo "::error::Notion sync staging/backup directory leaked after completion"
            exit 1
          fi

          {
            echo "## Notion sync"
            echo ""
            echo "Published: **$published**"
            echo "Reused: **$(jq -r '.reused' .notion-sync-report.json)**"
            echo "Rebuilt: **$(jq -r '.rebuilt' .notion-sync-report.json)**"
            echo "Deleted: **$(jq -r '.deleted | length' .notion-sync-report.json)**"
            echo "Fast path: **$(jq -r '.fastPath' .notion-sync-report.json)**"
            echo "Presentation invalidated: **$(jq -r '.invalidated | length' /tmp/notion-presentation-fingerprints.json)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize runtime and dependency fingerprint
        run: cp /tmp/notion-sync-deps.sha256 .notion-sync-deps.sha256

      - name: Decide homepage presentation refresh
        id: presentation
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          refresh=0
          if [ "$PREFLIGHT_ONLY" = "true" ] || [ "$EVENT_NAME" = "push" ] || [ "$TRIGGER_SOURCE" = "manual" ] || [ "$TRIGGER_SOURCE" = "manual-health" ] || [ "$TRIGGER_SOURCE" = "weekly-presentation" ]; then
            refresh=1
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "Homepage presentation refresh: $refresh (event=$EVENT_NAME, trigger=${TRIGGER_SOURCE:-none}, preflight=${PREFLIGHT_ONLY:-false})"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Validate candidate snapshot before commit
        env:
          STRICT_CONTENT: '1'
          REFRESH_HOMEPAGE_ROTATION: ${{ steps.presentation.outputs.refresh }}
        run: bash scripts/build-and-verify.sh public

      - name: Classify material site change
        id: site_change
        run: |
          if git diff --quiet -- content/posts data/homepage_runtime.toml; then
            material_changed=false
          else
            material_changed=true
          fi
          echo "material_changed=$material_changed" >> "$GITHUB_OUTPUT"
          echo "Material site change: $material_changed"

      - name: Report full candidate preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only == true }}
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          MATERIAL_CHANGED: ${{ steps.site_change.outputs.material_changed }}
        run: |
          {
            echo ""
            echo "## Full candidate preflight"
            echo ""
            echo "Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "Materialized latest Notion production data: **PASS**"
            echo "Production-equivalent build-and-verify: **PASS**"
            echo "Material site change relative to candidate ref: **$MATERIAL_CHANGED**"
            echo "Commit: **SKIPPED**"
            echo "Deployment: **SKIPPED**"
            echo "Runner workspace is ephemeral; generated candidate state is discarded after this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only the validated synchronized snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.preflight_only != true }}
        id: sync_commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content/posts data/homepage_runtime.toml .notion-sync-manifest.json .notion-sync-deps.sha256 package-lock.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No synchronized-content or presentation-state commit required."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "🔄 Sync site state ($(date -u +"%Y-%m-%dT%H:%M:%SZ"))"
          source_sha="$(git rev-parse HEAD)"

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Validated site state committed: $source_sha"

      - name: Dispatch exact-main deployment when required
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.preflight_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.sync_commit.outputs.source_sha }}
          CHANGED: ${{ steps.sync_commit.outputs.changed }}
          MATERIAL_CHANGED: ${{ steps.site_change.outputs.material_changed }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail
          should_deploy=false
          deploy_reason="no-deployment-worthy-change"

          if [ "$EVENT_NAME" = "push" ] && [ "$CHANGED" = "true" ]; then
            should_deploy=true
            deploy_reason="push-created-synchronized-state"
          elif [ "$FORCE_DEPLOY" = "true" ]; then
            should_deploy=true
            deploy_reason="explicit-force-redeploy"
          elif [ "$MATERIAL_CHANGED" = "true" ]; then
            should_deploy=true
            deploy_reason="material-site-change"
          fi

          if [ "$should_deploy" != "true" ]; then
            echo "Notion synchronization completed without a deployment-worthy site change."
            {
              echo ""
              echo "## Deployment decision"
              echo ""
              echo "Dispatch: **SKIPPED**"
              echo "Reason: **$deploy_reason**"
              echo "Trigger source: **${TRIGGER_SOURCE:-none}**"
              echo "Synchronized commit created: **${CHANGED:-false}**"
              echo "Material site change: **${MATERIAL_CHANGED:-false}**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          current_main="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [ "$current_main" != "$SOURCE_SHA" ]; then
            echo "::error::main moved before deployment dispatch. Expected $SOURCE_SHA, current $current_main. A newer main run must deploy instead."
            exit 1
          fi

          payload="$(jq -nc --arg ref main --arg sha "$SOURCE_SHA" '{ref:$ref, inputs:{source_sha:$sha}}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d "$payload"

          echo "Deployment dispatched for exact main SHA: $SOURCE_SHA ($deploy_reason)"
