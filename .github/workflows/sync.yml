name: "Notion sync -> validated main commit"

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
    - cron: '5 0 * * 1'
      timezone: 'Asia/Kuala_Lumpur'

permissions:
  contents: write
  actions: write

concurrency:
  group: notion-sync-main
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main-only synchronization
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Notion synchronization is restricted to main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Checkout main without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked Notion sync dependencies
        run: |
          test -s package-lock.json || {
            echo "::error::package-lock.json is required"
            exit 1
          }
          npm ci --ignore-scripts --no-audit --no-fund
          node --version
          npm --version
          npm ls --depth=0 '@notionhq/client' notion-to-md p-limit node-fetch

      - name: Check runtime and dependency fingerprint
        run: |
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          current_hash="$({
            printf 'node-major=%s\n' "$node_major"
            sha256sum package-lock.json
          } | sha256sum | awk '{print $1}')"
          previous_hash="$(cat .notion-sync-deps.sha256 2>/dev/null || true)"
          printf '%s\n' "$current_hash" > /tmp/notion-sync-deps.sha256

          if [ "$current_hash" != "$previous_hash" ]; then
            echo "Runtime or dependency graph changed; invalidating previous Notion manifest."
            rm -f .notion-sync-manifest.json
          else
            echo "Runtime/dependency graph unchanged; manifest reuse is allowed."
          fi

      - name: Sync Notion into candidate snapshot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node ./sync.mjs

      - name: Verify sync report and article bundles
        run: |
          test -s .notion-sync-report.json
          test -s .notion-sync-manifest.json
          jq -e '
            .status == "complete" and
            (.published == .written) and
            (.written == (.reused + .rebuilt)) and
            (.deleted | type == "array") and
            (.pages | type == "array")
          ' .notion-sync-report.json > /dev/null

          published="$(jq -r '.published' .notion-sync-report.json)"
          written="$(jq -r '.written' .notion-sync-report.json)"
          bundle_count="$(find content/posts -mindepth 2 -maxdepth 2 -type f -name 'index.md' | wc -l | tr -d ' ')"
          manifest_count="$(jq -r '.pages | length' .notion-sync-manifest.json)"

          test "$published" -eq "$written"
          test "$written" -eq "$bundle_count"
          test "$published" -eq "$manifest_count"
          test -s content/posts/_index.md

          if find content -maxdepth 1 -type d \( -name '.posts-staging-*' -o -name '.posts-backup-*' \) | grep -q .; then
            echo "::error::Notion sync staging/backup directory leaked after completion"
            exit 1
          fi

          {
            echo "## Notion sync"
            echo ""
            echo "Published: **$published**"
            echo "Reused: **$(jq -r '.reused' .notion-sync-report.json)**"
            echo "Rebuilt: **$(jq -r '.rebuilt' .notion-sync-report.json)**"
            echo "Deleted: **$(jq -r '.deleted | length' .notion-sync-report.json)**"
            echo "Fast path: **$(jq -r '.fastPath' .notion-sync-report.json)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize runtime and dependency fingerprint
        run: cp /tmp/notion-sync-deps.sha256 .notion-sync-deps.sha256

      - name: Decide homepage presentation refresh
        id: presentation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          refresh=0
          if [ "$EVENT_NAME" != "schedule" ] || [ "$EVENT_SCHEDULE" = "5 0 * * 1" ]; then
            refresh=1
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "Homepage presentation refresh: $refresh"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Validate candidate snapshot before commit
        env:
          STRICT_CONTENT: '1'
          REFRESH_HOMEPAGE_ROTATION: ${{ steps.presentation.outputs.refresh }}
        run: bash scripts/build-and-verify.sh public

      - name: Commit only the validated synchronized snapshot
        id: sync_commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content/posts data/homepage_runtime.toml .notion-sync-manifest.json .notion-sync-deps.sha256 package-lock.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No synchronized-content or presentation-state commit required."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "🔄 Sync site state ($(date -u +"%Y-%m-%dT%H:%M:%SZ"))"
          source_sha="$(git rev-parse HEAD)"

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Validated site state committed: $source_sha"

      - name: Dispatch exact-main deployment when required
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.sync_commit.outputs.source_sha }}
          CHANGED: ${{ steps.sync_commit.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          should_deploy=false
          if [ "$EVENT_NAME" != "schedule" ] || [ "$CHANGED" = "true" ] || [ "$RUN_ATTEMPT" -gt 1 ] || [ "$EVENT_SCHEDULE" = "5 0 * * 1" ]; then
            should_deploy=true
          fi

          if [ "$should_deploy" != "true" ]; then
            echo "Scheduled Notion sync is unchanged; no deployment dispatch required."
            exit 0
          fi

          current_main="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [ "$current_main" != "$SOURCE_SHA" ]; then
            echo "::error::main moved before deployment dispatch. Expected $SOURCE_SHA, current $current_main. A newer main run must deploy instead."
            exit 1
          fi

          payload="$(jq -nc --arg ref main --arg sha "$SOURCE_SHA" '{ref:$ref, inputs:{source_sha:$sha}}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d "$payload"

          echo "Deployment dispatched for exact main SHA: $SOURCE_SHA"
