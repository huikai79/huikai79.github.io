name: "Feature live reader QA smoke"

on:
  push:
    branches:
      - feature/binary-maintenance-live-qa-20260908
    paths:
      - '.github/workflows/live-reader-qa-feature-smoke.yml'
      - 'scripts/live-reader-qa.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_SITE_URL: https://huikai.com.kg
      EXPECTED_SOURCE_SHA: 334bd87c35904cfae16b29cac1b23ea1a7238455
      LIVE_QA_OUTPUT: live-reader-qa
    steps:
      - name: Checkout feature QA code
        uses: actions/checkout@v7
        with:
          ref: feature/binary-maintenance-live-qa-20260908
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright 1.63.0 and Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run live QA against current production
        run: node scripts/live-reader-qa.mjs

      - name: Upload live QA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: feature-live-reader-qa-${{ github.sha }}
          path: live-reader-qa/
          retention-days: 14
          if-no-files-found: warn
