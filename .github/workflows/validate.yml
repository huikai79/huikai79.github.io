name: "PR Hugo validation"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-hugo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify committed Notion snapshot
        run: |
          test -s .notion-sync-manifest.json
          test -s content/posts/_index.md
          test -s package-lock.json
          test -s data/homepage_runtime.toml

          bundle_count="$(find content/posts -mindepth 2 -maxdepth 2 -type f -name 'index.md' | wc -l | tr -d ' ')"
          manifest_count="$(jq -r '.pages | length' .notion-sync-manifest.json)"
          test "$bundle_count" -eq "$manifest_count"

          if find content -maxdepth 1 -type d \( -name '.posts-staging-*' -o -name '.posts-backup-*' \) | grep -q .; then
            echo "::error::Notion sync staging/backup directory is committed or leaked"
            exit 1
          fi

      - name: Apply technical-only comments policy
        run: |
          python3 scripts/apply-comments-policy.py
          cp .notion-sync-manifest.json /tmp/comments-manifest-a.json
          find content/posts -mindepth 2 -maxdepth 2 -type f -name 'index.md' -print0 | sort -z | xargs -0 sha256sum > /tmp/comments-source-a.sha256
          python3 scripts/apply-comments-policy.py
          cmp /tmp/comments-manifest-a.json .notion-sync-manifest.json
          find content/posts -mindepth 2 -maxdepth 2 -type f -name 'index.md' -print0 | sort -z | xargs -0 sha256sum > /tmp/comments-source-b.sha256
          cmp /tmp/comments-source-a.sha256 /tmp/comments-source-b.sha256

      - name: Setup Go for actionlint
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Verify production workflow safety contracts
        run: |
          grep -Fq 'Production deployment is restricted to main' .github/workflows/deploy.yml
          grep -Fq 'Deployment lineage mismatch' .github/workflows/deploy.yml
          grep -Fq 'main moved after deployment dispatch' .github/workflows/deploy.yml
          grep -Fq 'public/source-commit.txt' .github/workflows/deploy.yml
          if grep -Fq 'public/.source-commit' .github/workflows/deploy.yml; then
            echo "::error::Pages lineage marker must not be hidden because upload-pages-artifact excludes hidden files"
            exit 1
          fi
          grep -Fq 'Notion synchronization is restricted to main' .github/workflows/sync.yml
          grep -Fq 'Apply technical-only comments policy' .github/workflows/sync.yml
          grep -Fq 'persist-credentials: false' .github/workflows/deploy.yml
          grep -Fq 'persist-credentials: false' .github/workflows/sync.yml
          grep -Fq "cron: '5 0 * * 1'" .github/workflows/sync.yml
          grep -Fq "timezone: 'Asia/Kuala_Lumpur'" .github/workflows/sync.yml
          grep -Fq 'EVENT_SCHEDULE' .github/workflows/sync.yml
          grep -Fq 'data/homepage_runtime.toml' .github/workflows/sync.yml

          if grep -Eq '^  (push|schedule):' .github/workflows/deploy.yml; then
            echo "::error::Production deploy workflow must only be entered through an explicit exact-SHA dispatch"
            exit 1
          fi

      - name: Verify homepage weekly rotation determinism
        run: |
          cp data/homepage_runtime.toml /tmp/homepage_runtime.original.toml

          HOMEPAGE_ROTATION_KEY=2026-W36 python3 scripts/prepare-homepage-rotation.py
          cp data/homepage_runtime.toml /tmp/homepage_runtime.w36-a.toml
          grep -Fq 'rotationKey = "2026-W36"' /tmp/homepage_runtime.w36-a.toml
          grep -Fq 'pageId = "23b7a59e-0439-80a6-9852-c373b03994f5"' /tmp/homepage_runtime.w36-a.toml
          grep -Fq 'path = "posts/King-of-Internet-Writing"' /tmp/homepage_runtime.w36-a.toml
          grep -Fq 'path = "posts/ngh"' /tmp/homepage_runtime.w36-a.toml

          HOMEPAGE_ROTATION_KEY=2026-W36 python3 scripts/prepare-homepage-rotation.py
          cmp /tmp/homepage_runtime.w36-a.toml data/homepage_runtime.toml

          HOMEPAGE_ROTATION_KEY=2026-W37 python3 scripts/prepare-homepage-rotation.py
          cp data/homepage_runtime.toml /tmp/homepage_runtime.w37.toml
          grep -Fq 'rotationKey = "2026-W37"' /tmp/homepage_runtime.w37.toml
          grep -Fq 'pageId = "23b7a59e-0439-80a6-9852-c373b03994f5"' /tmp/homepage_runtime.w37.toml
          grep -Fq 'path = "posts/FreeResource-1"' /tmp/homepage_runtime.w37.toml
          grep -Fq 'path = "posts/be-alife"' /tmp/homepage_runtime.w37.toml
          if cmp -s /tmp/homepage_runtime.w36-a.toml /tmp/homepage_runtime.w37.toml; then
            echo "::error::Adjacent rotation weeks must not resolve to the same runtime state"
            exit 1
          fi

          cp /tmp/homepage_runtime.original.toml data/homepage_runtime.toml

      - name: Setup site Go runtime
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Build and verify committed snapshot
        run: bash scripts/build-and-verify.sh public
