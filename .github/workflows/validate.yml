name: "PR Hugo validation"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-hugo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify committed Notion snapshot
        run: |
          test -s .notion-sync-manifest.json
          test -s content/posts/_index.md
          test -s package-lock.json

          bundle_count="$(find content/posts -mindepth 2 -maxdepth 2 -type f -name 'index.md' | wc -l | tr -d ' ')"
          manifest_count="$(jq -r '.pages | length' .notion-sync-manifest.json)"

          echo "Article bundles: $bundle_count"
          echo "Manifest pages: $manifest_count"
          test "$bundle_count" -eq "$manifest_count"

          if find content -maxdepth 1 -type d \( -name '.posts-staging-*' -o -name '.posts-backup-*' \) | grep -q .; then
            echo "::error::Notion sync staging/backup directory is committed or leaked"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Check Hugo and Blowfish versions
        run: |
          hugo version
          go version
          go mod download
          hugo mod graph | tee /tmp/hugo-mod-graph.txt
          grep -q 'github.com/nunocoracao/blowfish/v3@v3.6.0' /tmp/hugo-mod-graph.txt
          test ! -d themes/blowfish

          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::Go module files are not fully committed"
            exit 1
          fi

          if grep -R -q 'github.com/nunocoracao/blowfish/v2' go.mod go.sum config/_default; then
            echo "::error::Blowfish v2 reference remains after the v3 upgrade"
            exit 1
          fi

      - name: Validate templates
        run: |
          hugo --printPathWarnings --templateMetrics --templateMetricsHints 2>&1 | tee /tmp/hugo-template.log
          if grep -Fq '.Site.Data was deprecated' /tmp/hugo-template.log; then
            echo "::error::Deprecated .Site.Data API is still used"
            exit 1
          fi

      - name: Build site from a clean destination
        run: |
          rm -rf public
          hugo --minify

      - name: Verify rendered site
        run: python3 scripts/verify-rendered-site.py public
