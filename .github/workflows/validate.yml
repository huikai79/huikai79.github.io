name: "PR Hugo validation"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-hugo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify committed Notion snapshot
        run: |
          test -s .notion-sync-manifest.json
          test -s content/posts/_index.md

          bundle_count="$(find content/posts -mindepth 2 -maxdepth 2 -type f -name 'index.md' | wc -l | tr -d ' ')"
          manifest_count="$(jq -r '.pages | length' .notion-sync-manifest.json)"

          echo "Article bundles: $bundle_count"
          echo "Manifest pages: $manifest_count"
          test "$bundle_count" -eq "$manifest_count"

          if find content -maxdepth 1 -type d \( -name '.posts-staging-*' -o -name '.posts-backup-*' \) | grep -q .; then
            echo "::error::Notion sync staging/backup directory is committed or leaked"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Check Hugo and Blowfish versions
        run: |
          hugo version
          go version
          go mod download
          hugo mod graph | tee /tmp/hugo-mod-graph.txt
          grep -q 'github.com/nunocoracao/blowfish/v3@v3.6.0' /tmp/hugo-mod-graph.txt
          test ! -d themes/blowfish

          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::Go module files are not fully committed; run go mod download/tidy and commit the resulting go.mod/go.sum"
            exit 1
          fi

          if grep -R -q 'github.com/nunocoracao/blowfish/v2' go.mod go.sum config/_default; then
            echo "::error::Blowfish v2 reference remains after the v3 upgrade"
            exit 1
          fi

      - name: Validate templates
        run: hugo --printPathWarnings --templateMetrics --templateMetricsHints

      - name: Build site from a clean destination
        run: |
          rm -rf public
          hugo --minify

      - name: Verify site output
        run: |
          require_file() {
            if [ ! -s "$1" ]; then
              echo "::error::$2"
              exit 1
            fi
          }

          require_match() {
            if ! grep -Eq "$1" "$2"; then
              echo "::error::$3"
              exit 1
            fi
          }

          article="public/posts/how-to-be-an-expert/index.html"
          home="public/index.html"

          require_file "$home" "Homepage output is missing"
          require_file "$article" "Known article output is missing"
          require_match 'class="[^"]*scroll-to-top[^"]*"|class=scroll-to-top' "$article" "Scroll-to-top class is missing from the known article"
          require_match 'id="?scroll-to-top"?' "$article" "Blowfish v3 scroll-to-top DOM id is missing"
          require_match 'href="?#the-top"?' "$article" "Scroll-to-top anchor target is missing"
          require_match 'lang="?zh-CN"?' "$home" "Homepage language is not zh-CN"
          require_match '庄辉恺的个人博客' "$home" "Homepage site description is missing"
          require_match 'property="?og:image"?' "$home" "Homepage Open Graph image metadata is missing"
          require_match 'name="?twitter:image"?' "$home" "Homepage Twitter image metadata is missing"

          if grep -R -q 'prod-files-secure.s3.us-west-2.amazonaws.com' public; then
            echo "::error::Temporary Notion/S3 image URL is still present in rendered site"
            exit 1
          fi

          if grep -R -q '<svg \.\.\.' public; then
            echo "::error::Placeholder SVG markup is still present in rendered site"
            exit 1
          fi
