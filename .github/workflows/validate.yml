name: "PR Hugo validation"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-hugo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Notion content contract helpers
        run: |
          node scripts/verify-notion-content-contract.mjs
          node scripts/verify-notion-cover-contract.mjs
          node scripts/verify-translation-draft-contract.mjs
          node scripts/test-article-bundle-contract.mjs
          node scripts/test-main-release-contract.mjs
          node --check scripts/article-bundle-contract.mjs
          node --check sync.mjs
          node --check scripts/notion-cover-contract.mjs
          node --check scripts/check-notion-publication-contract.mjs
          node --check scripts/check-notion-staged-page.mjs
          node --check scripts/check-sync-deletion-quarantine.mjs
          node --check scripts/generate-translation-drafts.mjs
          node --check scripts/live-reader-qa.mjs
          node --check scripts/verify-comments-integration.mjs

          printf '%s\n' '{"status":"complete","published":14,"deleted":["one"]}' > /tmp/deletion-safe.json
          node scripts/check-sync-deletion-quarantine.mjs /tmp/deletion-safe.json

          printf '%s\n' '{"status":"complete","published":11,"deleted":["a","b","c"]}' > /tmp/deletion-blocked.json
          if node scripts/check-sync-deletion-quarantine.mjs /tmp/deletion-blocked.json; then
            echo "::error::Deletion quarantine regression: 3/14 deletion must be blocked"
            exit 1
          fi

      - name: Verify committed Notion snapshot
        run: |
          test -s .notion-sync-manifest.json
          test -s content/posts/_index.md
          test -s content/posts/_index.zh-cn.md
          test -s package-lock.json
          test -s data/homepage_runtime.toml

          manifest_count="$(jq -r '.pages | length' .notion-sync-manifest.json)"
          bundle_count=0
          while IFS=$'\t' read -r bundle_path content_file; do
            if [ -z "$bundle_path" ] || [ -z "$content_file" ]; then
              echo "::error::Committed Notion manifest article is missing bundlePath/slug/contentFile"
              exit 1
            fi
            article_source="content/posts/${bundle_path}/${content_file}"
            if [ ! -s "$article_source" ]; then
              echo "::error::Committed manifest article source is missing: $article_source"
              exit 1
            fi
            bundle_count=$((bundle_count + 1))
          done < <(jq -r '.pages[] | [(.bundlePath // .slug), (.contentFile // "index.md")] | @tsv' .notion-sync-manifest.json)
          test "$bundle_count" -eq "$manifest_count"

          if find content -maxdepth 1 -type d \( -name '.posts-staging-*' -o -name '.posts-backup-*' \) | grep -q .; then
            echo "::error::Notion sync staging/backup directory is committed or leaked"
            exit 1
          fi

      - name: Apply comments policy idempotently
        run: |
          python3 scripts/apply-comments-policy.py
          cp .notion-sync-manifest.json /tmp/comments-manifest-a.json
          jq -r '.pages[] | [(.bundlePath // .slug), (.contentFile // "index.md")] | @tsv' .notion-sync-manifest.json \
            | while IFS=$'\t' read -r bundle_path content_file; do printf 'content/posts/%s/%s\0' "$bundle_path" "$content_file"; done \
            | sort -z | xargs -0 -r sha256sum > /tmp/comments-source-a.sha256
          python3 scripts/apply-comments-policy.py
          cmp /tmp/comments-manifest-a.json .notion-sync-manifest.json
          jq -r '.pages[] | [(.bundlePath // .slug), (.contentFile // "index.md")] | @tsv' .notion-sync-manifest.json \
            | while IFS=$'\t' read -r bundle_path content_file; do printf 'content/posts/%s/%s\0' "$bundle_path" "$content_file"; done \
            | sort -z | xargs -0 -r sha256sum > /tmp/comments-source-b.sha256
          cmp /tmp/comments-source-a.sha256 /tmp/comments-source-b.sha256

      - name: Setup Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.0'
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Verify production workflow safety contracts
        run: |
          set -euo pipefail
          python3 scripts/verify-action-sha-pinning.py

          require_fixed() {
            local needle="$1"
            local file="$2"
            if ! grep -Fq -- "$needle" "$file"; then
              echo "::error::Safety contract missing in $file: $needle"
              exit 1
            fi
          }

          require_fixed 'Production deployment is restricted to main' .github/workflows/deploy.yml
          require_fixed 'Deployment lineage mismatch' .github/workflows/deploy.yml
          require_fixed 'main moved after deployment dispatch' .github/workflows/deploy.yml
          require_fixed 'public/source-commit.txt' .github/workflows/deploy.yml
          require_fixed 'persist-credentials: false' .github/workflows/deploy.yml
          if grep -Fq 'public/.source-commit' .github/workflows/deploy.yml; then
            echo "::error::Pages lineage marker must not be hidden because upload-pages-artifact excludes hidden files"
            exit 1
          fi
          if grep -Eq '^  (push|schedule):' .github/workflows/deploy.yml; then
            echo "::error::Production deploy workflow must only be entered through an explicit exact-SHA dispatch"
            exit 1
          fi

          require_fixed 'Notion synchronization is restricted to main' .github/workflows/sync.yml
          require_fixed 'Verify publication contract without writing production content' .github/workflows/sync.yml
          require_fixed 'NOTION_SYNC_MODE: production' .github/workflows/sync.yml
          require_fixed 'Enforce deletion quarantine' .github/workflows/sync.yml
          require_fixed 'Apply comments policy' .github/workflows/sync.yml
          require_fixed 'Classify material site change' .github/workflows/sync.yml
          require_fixed 'Notion synchronization completed without a deployment-worthy site change' .github/workflows/sync.yml
          require_fixed 'notion-publication-contract-${{ github.run_id }}' .github/workflows/sync.yml
          require_fixed 'contentFile' .github/workflows/sync.yml
          require_fixed 'bundlePath' .github/workflows/sync.yml
          require_fixed 'content/posts/_index.zh-cn.md' .github/workflows/sync.yml
          require_fixed 'persist-credentials: false' .github/workflows/sync.yml
          require_fixed 'data/homepage_runtime.toml' .github/workflows/sync.yml
          if grep -Eq '^  schedule:' .github/workflows/sync.yml; then
            echo "::error::Periodic polling belongs to publication health, not the mutation-capable synchronization workflow"
            exit 1
          fi

          require_fixed "cron: '*/20 * * * *'" .github/workflows/notion-publication-health.yml
          require_fixed "cron: '5 0 * * 1'" .github/workflows/notion-publication-health.yml
          require_fixed "timezone: 'Asia/Kuala_Lumpur'" .github/workflows/notion-publication-health.yml
          require_fixed "NOTION_CONTRACT_NONBLOCKING: '1'" .github/workflows/notion-publication-health.yml
          require_fixed 'notion-publication-health-${{ github.run_id }}' .github/workflows/notion-publication-health.yml
          require_fixed 'actions/workflows/sync.yml/dispatches' .github/workflows/notion-publication-health.yml
          require_fixed 'production state remains untouched' .github/workflows/notion-publication-health.yml

          require_fixed 'Classify code-only release eligibility' .github/workflows/main-code-release.yml
          require_fixed 'STRICT_CONTENT' .github/workflows/main-code-release.yml
          require_fixed 'main moved before code-only deployment dispatch' .github/workflows/main-code-release.yml
          require_fixed 'actions/workflows/deploy.yml/dispatches' .github/workflows/main-code-release.yml
          require_fixed 'persist-credentials: false' .github/workflows/main-code-release.yml
          require_fixed 'content/posts/' scripts/main-release-contract.mjs
          require_fixed 'notion-sync-owned' scripts/main-release-contract.mjs

          require_fixed 'semantic cover required before production publication' scripts/check-notion-publication-contract.mjs
          require_fixed 'NOTION_CONTRACT_NONBLOCKING' scripts/check-notion-publication-contract.mjs
          require_fixed 'notionUrl' scripts/check-notion-publication-contract.mjs
          require_fixed 'publicationReady' scripts/check-notion-staged-page.mjs
          require_fixed 'Translation Status' scripts/notion-content-contract.mjs

          require_fixed 'verify-comments-integration.mjs' .github/workflows/weekly-reader-a11y.yml
          require_fixed 'layouts/partials/comments.html' .github/workflows/weekly-reader-a11y.yml
          require_fixed 'waitUntil: "domcontentloaded"' scripts/live-reader-qa.mjs
          if grep -Fq 'waitUntil: "networkidle"' scripts/live-reader-qa.mjs; then
            echo "::error::Live reader QA must use component readiness rather than global network-idle waits"
            exit 1
          fi

          require_fixed 'OPENAI_API_KEY' .github/workflows/translation-drafts.yml
          require_fixed 'TRANSLATION_APPLY' .github/workflows/translation-drafts.yml
          require_fixed 'default: false' .github/workflows/translation-drafts.yml
          if grep -Eq '^  (push|schedule):' .github/workflows/translation-drafts.yml; then
            echo "::error::Paid translation draft generation must remain manually gated until explicitly authorized"
            exit 1
          fi

      - name: Verify homepage selection determinism
        run: |
          cp data/homepage_runtime.toml /tmp/homepage_runtime.original.toml

          HOMEPAGE_ROTATION_KEY=2026-W36 python3 scripts/prepare-homepage-rotation.py
          cp data/homepage_runtime.toml /tmp/homepage_runtime.w36-a.toml
          grep -Fq 'rotationKey = "2026-W36"' /tmp/homepage_runtime.w36-a.toml

          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          runtime = tomllib.loads(Path('/tmp/homepage_runtime.w36-a.toml').read_text(encoding='utf-8'))
          selected = runtime.get('selected', [])
          expected = int(runtime.get('selectedLimit', 0))
          if not isinstance(selected, list) or len(selected) != expected:
              raise SystemExit(f"homepage selected/runtime mismatch: selected={len(selected) if isinstance(selected, list) else 'invalid'}, expected={expected}")
          if int(runtime.get('rotationSlots', 0)) > int(runtime.get('poolSize', 0)):
              raise SystemExit('homepage rotationSlots cannot exceed poolSize')
          PY

          HOMEPAGE_ROTATION_KEY=2026-W36 python3 scripts/prepare-homepage-rotation.py
          cmp /tmp/homepage_runtime.w36-a.toml data/homepage_runtime.toml

          HOMEPAGE_ROTATION_KEY=2026-W37 python3 scripts/prepare-homepage-rotation.py
          cp data/homepage_runtime.toml /tmp/homepage_runtime.w37.toml
          grep -Fq 'rotationKey = "2026-W37"' /tmp/homepage_runtime.w37.toml
          if cmp -s /tmp/homepage_runtime.w36-a.toml /tmp/homepage_runtime.w37.toml; then
            echo "::error::Adjacent rotation weeks must produce distinct rotation metadata"
            exit 1
          fi

          cp /tmp/homepage_runtime.original.toml data/homepage_runtime.toml

      - name: Setup site Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Build and verify committed snapshot
        run: bash scripts/build-and-verify.sh public
