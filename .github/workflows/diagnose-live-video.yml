name: "Diagnose live Notion video"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-live-video.yml"

permissions:
  contents: read

jobs:
  live-video-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production video gateway end to end
        shell: bash
        run: |
          set -euo pipefail

          site_origin="https://huikai.com.kg"
          page_path="/posts/first-hackathon/"
          page_url="${site_origin}${page_path}"

          curl --fail-with-body --silent --show-error --location \
            --max-time 20 \
            "$page_url" \
            --output /tmp/page.html

          block_marker="$(grep -m1 -oE 'data-notion-video-block=("[0-9a-fA-F-]{36}"|'"'"'[0-9a-fA-F-]{36}'"'"'|[0-9a-fA-F-]{36})' /tmp/page.html || true)"
          block_id="$(printf '%s' "$block_marker" | grep -oE '[0-9a-fA-F-]{36}' || true)"
          if ! printf '%s' "$block_id" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::Published article does not expose a valid Notion video block marker"
            exit 1
          fi

          session_status="$(curl --silent --show-error \
            --max-time 20 \
            --request POST \
            --header "Origin: ${site_origin}" \
            --header "Sec-Fetch-Site: same-origin" \
            --header "X-Media-Session: 1" \
            --cookie-jar /tmp/cookies.txt \
            --output /tmp/session.body \
            --write-out '%{http_code}' \
            "${site_origin}/media/session")"
          echo "Production media session status: ${session_status:-missing}"
          test "$session_status" = "204" || {
            echo "::error::Production media session bootstrap did not return HTTP 204"
            exit 1
          }

          media_url="${site_origin}/media/video/${block_id}?page=%2Fposts%2Ffirst-hackathon%2F"
          curl --silent --show-error \
            --max-time 30 \
            --header "Referer: ${page_url}" \
            --header "Sec-Fetch-Site: same-origin" \
            --header "Range: bytes=0-0" \
            --cookie /tmp/cookies.txt \
            --dump-header /tmp/video.headers \
            --output /tmp/video.body \
            "$media_url"

          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/video.headers)"
          content_type="$(awk -F': *' 'tolower($1)=="content-type" {gsub("\r", "", $2); value=$2} END {print value}' /tmp/video.headers)"
          content_range="$(awk -F': *' 'tolower($1)=="content-range" {gsub("\r", "", $2); value=$2} END {print value}' /tmp/video.headers)"
          body_size="$(wc -c < /tmp/video.body | tr -d ' ')"

          echo "Production video status: ${status:-missing}"
          echo "Production video Content-Type: ${content_type:-missing}"
          echo "Production video Content-Range: ${content_range:-missing}"
          echo "Production video first-range bytes received: ${body_size}"

          test "$status" = "206" || {
            echo "::error::Production video gateway did not return HTTP 206 for a Range request"
            exit 1
          }
          printf '%s' "$content_type" | grep -Eqi '^video/' || {
            echo "::error::Production video gateway did not return a browser video MIME type"
            exit 1
          }
          printf '%s' "$content_range" | grep -Eqi '^bytes 0-0/[0-9]+$' || {
            echo "::error::Production video gateway did not return a valid Content-Range"
            exit 1
          }
          test "$body_size" = "1" || {
            echo "::error::Production video gateway did not honor the one-byte Range request"
            exit 1
          }

          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            --header "Referer: ${page_url}" \
            --header "Sec-Fetch-Site: same-origin" \
            --cookie /tmp/cookies.txt \
            --output /tmp/video.mp4 \
            "$media_url"

          command -v ffprobe >/dev/null 2>&1 || {
            echo "::error::ffprobe is unavailable on the GitHub runner"
            exit 1
          }

          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/video.mp4)"
          video_codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/video.mp4)"
          audio_codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/video.mp4 || true)"

          echo "Production video duration: ${duration:-missing}"
          echo "Production video codec: ${video_codec:-missing}"
          echo "Production audio codec: ${audio_codec:-none}"

          awk -v d="$duration" 'BEGIN { exit !(d > 0) }' || {
            echo "::error::Production MP4 does not expose a positive media duration"
            exit 1
          }
          printf '%s' "$video_codec" | grep -Eqi '^(h264|vp9|av1)$' || {
            echo "::error::Production MP4 video codec is not in the expected browser-compatible set"
            exit 1
          }

          echo "Production Notion video gateway smoke test: PASS"
