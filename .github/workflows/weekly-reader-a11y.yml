name: "Weekly cross-browser reader accessibility QA"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/weekly-reader-a11y.yml"
      - "scripts/weekly-reader-a11y-qa.mjs"
      - "scripts/verify-comments-integration.mjs"
      - "scripts/verify-comments-admin.mjs"
      - "scripts/verify-toc-behavior.mjs"
      - "scripts/verify-longform-reading.mjs"
      - "scripts/verify-back-to-top-behavior.mjs"
      - "scripts/verify-header-home-navigation.mjs"
      - "scripts/verify-site-log-layout.mjs"
      - "assets/css/custom.css"
      - "assets/css/huikai-comments.css"
      - "assets/css/huikai-comments-admin.css"
      - "assets/js/huikai-comments.js"
      - "assets/js/huikai-comments-admin.js"
      - "assets/js/reading-progress.js"
      - "assets/js/scroll-to-top.js"
      - "layouts/_default/single.html"
      - "layouts/site-log/**"
      - "layouts/partials/article/**"
      - "layouts/partials/comments.html"
      - "layouts/partials/extend-head-uncached.html"
      - "layouts/partials/footer.html"
      - "layouts/shortcodes/comments-admin.html"
      - "config/_default/params.toml"
      - "config/_default/menus.zh-TW.toml"
      - "config/_default/menus.zh-CN.toml"
      - "i18n/zh-TW.yaml"
      - "i18n/zh-CN.yaml"
      - "workers/huikai-comments/**"
      - "content/_index.md"
      - "content/_index.zh-cn.md"
      - "content/comments-admin/**"
      - "content/posts/_index.md"
      - "content/posts/_index.zh-cn.md"
      - "content/projects/**"
      - "content/site-log/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weekly-reader-a11y.yml"
      - "scripts/weekly-reader-a11y-qa.mjs"
      - "scripts/verify-comments-integration.mjs"
      - "scripts/verify-comments-admin.mjs"
      - "scripts/verify-toc-behavior.mjs"
      - "scripts/verify-longform-reading.mjs"
      - "scripts/verify-back-to-top-behavior.mjs"
      - "scripts/verify-header-home-navigation.mjs"
      - "scripts/verify-site-log-layout.mjs"
      - "assets/css/custom.css"
      - "assets/css/huikai-comments.css"
      - "assets/css/huikai-comments-admin.css"
      - "assets/js/huikai-comments.js"
      - "assets/js/huikai-comments-admin.js"
      - "assets/js/reading-progress.js"
      - "assets/js/scroll-to-top.js"
      - "layouts/_default/single.html"
      - "layouts/site-log/**"
      - "layouts/partials/article/**"
      - "layouts/partials/comments.html"
      - "layouts/partials/extend-head-uncached.html"
      - "layouts/partials/footer.html"
      - "layouts/shortcodes/comments-admin.html"
      - "config/_default/params.toml"
      - "config/_default/menus.zh-TW.toml"
      - "config/_default/menus.zh-CN.toml"
      - "i18n/zh-TW.yaml"
      - "i18n/zh-CN.yaml"
      - "workers/huikai-comments/**"
      - "content/_index.md"
      - "content/_index.zh-cn.md"
      - "content/comments-admin/**"
      - "content/posts/_index.md"
      - "content/posts/_index.zh-cn.md"
      - "content/projects/**"
      - "content/site-log/**"
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'
      timezone: 'Asia/Kuala_Lumpur'

permissions:
  contents: read

concurrency:
  group: weekly-reader-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEEKLY_QA_OUTPUT: weekly-reader-a11y-qa
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
    steps:
      - name: Checkout QA source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup Go for candidate build
        if: github.event_name != 'schedule'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo for candidate build
        if: github.event_name != 'schedule'
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Build candidate snapshot for PR or main push
        if: github.event_name != 'schedule'
        run: |
          bash scripts/build-and-verify.sh public
          printf '%s\n' "$GITHUB_SHA" > public/source-commit.txt

      - name: Verify moderation route privacy contract
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          test -f public/comments-admin/index.html
          grep -Fq 'noindex,nofollow,noarchive' public/comments-admin/index.html
          if grep -Fq '/comments-admin/' public/sitemap.xml; then
            echo "::error::Unlisted comments moderation route leaked into sitemap"
            exit 1
          fi

      - name: Serve candidate snapshot locally
        if: github.event_name != 'schedule'
        run: |
          python3 -m http.server 4173 --directory public >/tmp/weekly-reader-a11y-http.log 2>&1 &
          echo $! >/tmp/weekly-reader-a11y-http.pid
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              echo "LIVE_SITE_URL=http://127.0.0.1:4173" >> "$GITHUB_ENV"
              echo "EXPECTED_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
              echo "Candidate reader surface ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/weekly-reader-a11y-http.log || true
          echo "::error::Candidate reader surface did not become ready"
          exit 1

      - name: Target production for scheduled audit
        if: github.event_name == 'schedule'
        run: echo "LIVE_SITE_URL=https://huikai.com.kg" >> "$GITHUB_ENV"

      - name: Install pinned cross-browser accessibility runtime
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0 axe-core@4.13.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify candidate HUIKAI comments interaction and layout
        if: github.event_name != 'schedule'
        env:
          COMMENTS_PROVIDER: huikai
          LIVE_SITE_URL: http://127.0.0.1:4173
          COMMENTS_QA_OUTPUT: weekly-reader-a11y-qa
        run: node scripts/verify-comments-integration.mjs

      - name: Verify candidate comments moderation surface
        if: github.event_name != 'schedule'
        env:
          LIVE_SITE_URL: http://127.0.0.1:4173
          COMMENTS_QA_OUTPUT: weekly-reader-a11y-qa
        run: node scripts/verify-comments-admin.mjs

      - name: Build deterministic Giscus rollback preview
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          cp config/_default/params.toml /tmp/giscus-rollback-params.toml
          restore_params() { cp /tmp/giscus-rollback-params.toml config/_default/params.toml; }
          trap restore_params EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path("config/_default/params.toml")
          text = path.read_text(encoding="utf-8")
          marker = '[comments]'
          start = text.index(marker)
          end = text.index('\n[giscus]', start)
          block = text[start:end]
          if block.count('provider = "huikai"') != 1:
              raise SystemExit("production comments provider contract drifted")
          block = block.replace('provider = "huikai"', 'provider = "giscus"')
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY
          rm -rf /tmp/giscus-comments-preview
          hugo --minify --destination /tmp/giscus-comments-preview
          restore_params
          trap - EXIT
          git diff --exit-code -- config/_default/params.toml
          python3 -m http.server 4174 --directory /tmp/giscus-comments-preview >/tmp/giscus-comments-preview-http.log 2>&1 &
          for _ in $(seq 1 20); do
            curl --fail --silent --show-error http://127.0.0.1:4174/posts/first-hackathon/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/giscus-comments-preview-http.log || true
          echo "::error::Giscus rollback preview did not become ready"
          exit 1

      - name: Verify candidate Giscus rollback integration deterministically
        if: github.event_name != 'schedule'
        env:
          COMMENTS_PROVIDER: giscus
          LIVE_SITE_URL: http://127.0.0.1:4174
        run: node scripts/verify-comments-integration.mjs

      - name: Run cross-browser accessibility QA
        run: node scripts/weekly-reader-a11y-qa.mjs

      - name: Verify TOC responsive and sticky behavior
        run: node scripts/verify-toc-behavior.mjs

      - name: Verify long-form and CJK reading behavior
        run: node scripts/verify-longform-reading.mjs

      - name: Verify back-to-top threshold, placement and footer avoidance
        run: node scripts/verify-back-to-top-behavior.mjs

      - name: Verify HUIKAI home-link navigation contract
        run: node scripts/verify-header-home-navigation.mjs

      - name: Verify compact site-log hierarchy and footer entry
        run: node scripts/verify-site-log-layout.mjs

      - name: Upload cross-browser accessibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: weekly-reader-a11y-${{ github.sha }}
          path: weekly-reader-a11y-qa/
          retention-days: 30
          if-no-files-found: warn
