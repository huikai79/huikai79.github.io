name: "Deploy exact main commit to GitHub Pages"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact main commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Reject non-main workflow dispatch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployment is restricted to main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Resolve immutable source SHA
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha must be a full 40-character commit SHA"
            exit 1
          fi

          if [ "$REQUESTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Deployment lineage mismatch: requested $REQUESTED_SHA but workflow main SHA is $GITHUB_SHA"
            exit 1
          fi

          echo "source_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Exact deployment source: $REQUESTED_SHA"

  build:
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout lineage against main
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA" || {
            echo "::error::Checkout SHA mismatch: expected $SOURCE_SHA, got $actual"
            exit 1
          }

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::Requested source SHA is not contained in main"
            exit 1
          }

          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "::error::main moved after deployment dispatch; refusing stale production deployment"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Build and verify exact commit
        env:
          STRICT_CONTENT: '1'
        run: bash scripts/build-and-verify.sh public

      - name: Record artifact lineage
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > public/source-commit.txt
          {
            echo "## Deployment lineage"
            echo ""
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Workflow head: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs:
      - guard
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Check Cloudflare cache configuration before deployment
        id: cloudflare
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] && [ -z "$CF_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare purge: NOT_CONFIGURED"
          elif [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Cloudflare purge is partially configured. CF_ZONE_ID and CF_API_TOKEN must both be set or both be absent."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare purge: CONFIGURED"
          fi

      - name: Deploy exact artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Purge Cloudflare cache
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"

          if ! echo "$response" | jq -e '.success == true' > /dev/null; then
            echo "::error::Cloudflare rejected the cache purge response."
            echo "$response" | jq -c '{success, errors, messages}' || true
            exit 1
          fi

          echo "Cloudflare cache purged successfully."

      - name: Report production result
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          CF_CONFIGURED: ${{ steps.cloudflare.outputs.configured }}
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "GitHub Pages: **DEPLOYED**"
            if [ "$CF_CONFIGURED" = "true" ]; then
              echo "Cloudflare cache: **PURGED**"
            else
              echo "Cloudflare cache: **NOT_CONFIGURED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  live-reader-qa:
    runs-on: ubuntu-latest
    needs:
      - guard
      - deploy
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      LIVE_SITE_URL: https://huikai.com.kg
      EXPECTED_SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
      LIVE_QA_OUTPUT: live-reader-qa
    steps:
      - name: Checkout exact QA script source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install pinned Playwright runtime
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Wait for exact production lineage
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: |
          for attempt in $(seq 1 12); do
            actual="$(curl --fail --silent --show-error --location --max-time 15 "https://huikai.com.kg/source-commit.txt" || true)"
            actual="$(printf '%s' "$actual" | tr -d '\r\n')"
            if [ "$actual" = "$SOURCE_SHA" ]; then
              echo "Production lineage reached exact source SHA: $SOURCE_SHA"
              exit 0
            fi
            echo "Production edge not ready yet (attempt $attempt/12; got ${actual:-NO_RESPONSE})"
            sleep 5
          done
          echo "::error::Production edge did not expose expected source SHA $SOURCE_SHA"
          exit 1

      - name: Run live reader QA against production
        run: node scripts/live-reader-qa.mjs

      - name: Verify live TOC responsive and sticky behavior
        run: node scripts/verify-toc-behavior.mjs

      - name: Verify live long-form and CJK reading behavior
        run: node scripts/verify-longform-reading.mjs

      - name: Upload live QA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: live-reader-qa-${{ env.EXPECTED_SOURCE_SHA }}
          path: live-reader-qa/
          retention-days: 14
          if-no-files-found: warn
