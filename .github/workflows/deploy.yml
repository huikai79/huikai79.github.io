name: "Notion -> Hugo -> GitHub Pages + Cloudflare"

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install npm dependencies
        run: |
          npm install --no-save \
            '@notionhq/client@^2.3.0' \
            'notion-to-md@^2.4.0'     \
            'p-limit@^6.2.0'          \
            'node-fetch@^3.3.2'

      - name: Sync Notion -> Markdown
        env:
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node ./sync.mjs

      - name: Inspect synced article bundles
        run: |
          echo "=== Article bundle list ==="
          find content/posts -maxdepth 2 -type f -name "index.md" -print
          test -s content/posts/_index.md

      - name: Commit & push synced content
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add content/posts
          if git diff --cached --quiet; then
            echo "No synced-content changes to commit"
          else
            git commit -m "🔄 Sync from Notion ($(date -u +"%Y-%m-%dT%H:%M:%SZ"))"
            git push origin HEAD:main
          fi

      - name: Merge Blowfish theme overrides (no overwrite)
        run: |
          mkdir -p layouts assets
          rsync -a --ignore-existing themes/blowfish/layouts/ layouts/
          rsync -a --ignore-existing themes/blowfish/assets/ assets/

      - name: Restore custom single & pagination
        run: |
          mkdir -p layouts/_default layouts/partials/article

          if [ -f my_overrides/layouts/_default/single.html ]; then
            cp -f my_overrides/layouts/_default/single.html layouts/_default/single.html
          fi

          if [ -f my_overrides/layouts/partials/article/pagination.html ]; then
            cp -f my_overrides/layouts/partials/article/pagination.html layouts/partials/article/pagination.html
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.147.8
          extended: true

      - name: Check Hugo version
        run: |
          which hugo
          hugo version
          hugo env

      - name: Validate templates
        run: hugo --printPathWarnings --templateMetrics --templateMetricsHints

      - name: Build site from a clean destination
        run: |
          rm -rf public
          hugo --minify

      - name: List generated js/css
        run: ls -R public/js public/css || true

      - name: Verify site output
        run: |
          test -s public/index.html
          test -s public/posts/how-to-be-an-expert/index.html
          grep -q 'class=scroll-to-top\|class="scroll-to-top"' public/posts/how-to-be-an-expert/index.html
          grep -q 'lang=zh-CN\|lang="zh-CN"' public/index.html
          grep -q '庄辉恺的个人博客' public/index.html

          if grep -R -q 'prod-files-secure.s3.us-west-2.amazonaws.com' public; then
            echo "::error::Temporary Notion/S3 image URL is still present in rendered site"
            exit 1
          fi

          if grep -R -q '<svg \.\.\.' public; then
            echo "::error::Placeholder SVG markup is still present in rendered site"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare Cache
        if: ${{ success() }}
        run: |
          if response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"; then
            if echo "$response" | jq -e '.success == true' > /dev/null; then
              echo "Cloudflare cache purged"
            else
              echo "::warning::GitHub Pages deployed, but Cloudflare rejected the cache-purge response. Check CF_ZONE_ID and CF_API_TOKEN."
            fi
          else
            echo "::warning::GitHub Pages deployed, but Cloudflare cache purge failed. Check CF_ZONE_ID and CF_API_TOKEN."
          fi
