<div class="article-footer mx-auto mt-12 w-full max-w-3xl px-4">
  <section class="border-t border-neutral-200 py-6 dark:border-neutral-700" aria-label="{{ i18n "huikai.about_me" }}">
    <div class="mx-auto flex w-fit max-w-full items-center gap-4 text-left">
      {{ with .Site.Params.Author.image }}
        <img
          src="{{ . | safeURL }}"
          alt="{{ $.Site.Params.Author.name | default "Author" }}"
          class="author-avatar"
          loading="lazy"
        />
      {{ end }}

      <div class="min-w-0">
        <div class="author-label">{{ i18n "huikai.about_me" }}</div>
        <div class="author-name">{{ .Site.Params.Author.name }}</div>
        {{ with .Site.Params.Author.bio }}
          <div class="author-bio">{{ . }}</div>
        {{ end }}
        <a
          class="mt-2 inline-flex text-sm font-medium text-primary-600 hover:underline hover:underline-offset-4 dark:text-primary-400"
          href="{{ "about/" | relLangURL }}">
          {{ i18n "huikai.about_more" }}
        </a>
      </div>
    </div>
  </section>
</div>
