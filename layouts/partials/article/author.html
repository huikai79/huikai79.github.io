<div class="article-footer mx-auto mt-12 w-full max-w-3xl px-4">
  <section class="border-t border-neutral-200 py-6 dark:border-neutral-700" aria-label="作者">
    <div class="mx-auto flex w-fit max-w-full items-center gap-4 text-left">
      {{ with .Site.Params.Author.image }}
        <img
          src="{{ . | safeURL }}"
          alt="{{ $.Site.Params.Author.name | default "Author" }}"
          class="author-avatar"
          loading="lazy"
        />
      {{ end }}

      <div class="min-w-0">
        <div class="author-label">作者</div>
        <div class="author-name">{{ .Site.Params.Author.name }}</div>
        {{ with .Site.Params.Author.bio }}
          <div class="author-bio">{{ . }}</div>
        {{ end }}
        <div class="mt-2">
          {{ partial "author-links.html" . }}
        </div>
      </div>
    </div>
  </section>
</div>
