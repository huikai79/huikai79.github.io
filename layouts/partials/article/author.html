<div class="article-footer mx-auto mt-10 w-full max-w-3xl px-4">
  <div class="author-card">
    {{ with .Site.Params.Author.image }}
      <img
        src="{{ . | safeURL }}"
        alt="{{ $.Site.Params.Author.name | default "Author" }}"
        class="author-avatar"
        loading="lazy"
      />
    {{ end }}

    <div class="min-w-0 flex-1">
      <div class="author-label">作者</div>
      <div class="author-name">{{ .Site.Params.Author.name }}</div>
      {{ with .Site.Params.Author.bio }}
        <div class="author-bio">{{ . }}</div>
      {{ end }}
      <div class="mt-2">
        {{ partial "author-links.html" . }}
      </div>
    </div>
  </div>
</div>
