<div class="article-footer mx-auto mt-12 w-full max-w-3xl px-4">
  <section class="article-endcap border-t border-neutral-200 py-6 dark:border-neutral-700" aria-label="{{ i18n "huikai.about_me" }}">
    <div class="article-endcap__author">
      {{ with .Site.Params.Author.image }}
        <img
          src="{{ . | safeURL }}"
          alt="{{ $.Site.Params.Author.name | default "Author" }}"
          class="author-avatar"
          loading="lazy"
        />
      {{ end }}

      <div class="min-w-0">
        <div class="author-label">{{ i18n "huikai.about_me" }}</div>
        <div class="author-name">{{ .Site.Params.Author.name }}</div>
        {{ with .Site.Params.Author.bio }}
          <div class="author-bio">{{ . }}</div>
        {{ end }}
      </div>
    </div>

    <div class="article-endcap__actions">
      <a
        class="article-endcap__about-link"
        href="{{ "about/" | relLangURL }}">
        {{ i18n "huikai.about_more" }}
      </a>
      <div class="article-endcap__share">
        {{ partial "sharing-links.html" . }}
      </div>
    </div>
  </section>
</div>
