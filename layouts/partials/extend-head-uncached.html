{{- if .Params.noindex -}}
<meta name="robots" content="noindex,nofollow,noarchive">
{{- else if strings.HasSuffix .RelPermalink "/404.html" -}}
<meta name="robots" content="noindex,follow">
{{- end -}}

<style>
  /* Long-form reading polish. Kept tightly scoped so non-article surfaces are unchanged. */
  .article-reading-progress {
    position: fixed;
    inset: 0 auto auto 0;
    z-index: 100;
    width: 0;
    height: 2px;
    pointer-events: none;
    background: rgb(var(--color-primary-500, 59 130 246));
    transition: width 80ms linear;
  }

  .dark .article-reading-progress {
    background: rgb(var(--color-primary-400, 96 165 250));
  }

  @media (prefers-reduced-motion: reduce) {
    .article-reading-progress {
      transition: none;
    }
  }

  @media (min-width: 1280px) {
    .article-toc #TableOfContents a.active {
      color: rgb(var(--color-primary-600, 37 99 235));
      font-weight: 600;
      text-decoration-thickness: 2px;
      text-underline-offset: 0.2em;
    }

    .dark .article-toc #TableOfContents a.active {
      color: rgb(var(--color-primary-300, 147 197 253));
    }
  }

  /* CJK long-form baseline: keep body metrics unchanged, improve line breaking
     and prevent awkward one- or two-character heading tails on supported engines. */
  html:lang(zh-TW) .article-main,
  html:lang(zh-CN) .article-main {
    line-break: strict;
  }

  .article-main > h1,
  .article-main > h2,
  .article-main > h3 {
    text-wrap: balance;
  }

  .article-main > h2 {
    margin-top: 3rem;
    margin-bottom: 1.15rem;
  }

  .article-main > h3 {
    margin-top: 2.25rem;
    margin-bottom: 0.9rem;
  }

  /* Discovery summaries stay intentionally compact. */
  .huikai-post-list-item .article-link__summary,
  .related-reading-summary {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
    -webkit-line-clamp: 2;
  }

  /* Article archive: text owns the stable scan axis. Images are optional
     secondary media, so no-image rows remain complete without placeholders. */
  .huikai-post-list-item > .thumbnail {
    width: 100%;
    aspect-ratio: 3 / 2;
  }

  @media (min-width: 768px) {
    .huikai-post-list-item > .thumbnail {
      order: 2;
      width: clamp(11rem, 28%, 15rem);
      margin-inline-start: 1.75rem;
      margin-inline-end: 0;
    }
  }

  /* At the archive geometry breakpoint, reserve the same minimum vertical
     reading unit whether optional Hero media exists or not. This keeps the
     start of the next post from crowding a text-only preview without adding a
     placeholder image. Mobile remains natural-height. */
  @media (min-width: 853px) {
    .huikai-post-list-item {
      min-height: 180px;
    }
  }

  @media (max-width: 767.98px) {
    .article-main > h2 {
      margin-top: 2.5rem;
    }

    .article-main > h3 {
      margin-top: 2rem;
    }
  }
</style>

{{ partial "page-shell-style.html" . }}
