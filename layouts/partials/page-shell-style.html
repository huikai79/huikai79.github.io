<style>
  /* Shared HUIKAI entry-page geometry. Pages opt in with page-lead while each
     surface keeps its native role: scan-heavy hubs can use the full shell,
     long-form prose stays on a readable measure, and list pages must not let
     Blowfish's default max-w-prose silently narrow the shared lead. */
  #main-content:has(.huikai-page-lead) {
    --huikai-entry-reading-measure: 44rem;
  }

  #main-content:has(.huikai-page-lead) > header h1,
  #main-content:has(.huikai-page-lead) > article > header h1 {
    margin-top: 2rem;
    margin-bottom: 0;
    font-size: clamp(2.5rem, 4.5vw, 3.25rem);
    line-height: 1.08;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }

  #main-content:has(.huikai-page-lead) > article > section {
    margin-top: 1rem;
  }

  /* Blowfish list pages wrap markdown content in max-w-prose while simple
     pages do not. Remove that template-specific constraint only for entry
     pages using page-lead, then re-apply the shared reading measure to prose
     blocks. This keeps /projects/ on the same shell as /explore/ and /about/
     without stretching its two cards or changing the global list template. */
  #main-content:has(.huikai-page-lead) > section.prose > div:has(> .huikai-page-lead) {
    width: 100%;
    max-width: none;
  }

  #main-content:has(.huikai-page-lead)
    > section.prose
    > div:has(> .huikai-page-lead)
    > :is(p, ul, ol, blockquote) {
    max-width: var(--huikai-entry-reading-measure);
  }

  .huikai-page-lead {
    max-width: var(--huikai-entry-reading-measure);
    margin-top: 0;
    color: rgb(var(--color-neutral-600, 82 82 82));
  }

  .huikai-page-lead > :first-child {
    margin-top: 0;
  }

  .huikai-page-lead > :last-child {
    margin-bottom: 0;
  }

  .huikai-page-lead p {
    margin: 0;
    font-size: 1.125rem;
    line-height: 1.75;
  }

  .huikai-page-lead::after {
    content: "";
    display: block;
    width: 100%;
    margin-top: 2rem;
    border-top: 1px solid rgb(var(--color-neutral-200, 229 229 229));
  }

  .huikai-page-lead:not(:last-child) {
    margin-bottom: 2.75rem;
  }

  .dark .huikai-page-lead {
    color: rgb(var(--color-neutral-300, 212 212 212));
  }

  .dark .huikai-page-lead::after {
    border-color: rgb(var(--color-neutral-700, 64 64 64));
  }

  /* /about/ begins as an orientation page and becomes long-form reading after
     its first section divider. Keep that first viewport on the full shell, then
     cap every following block to the same CJK-friendly reading measure. */
  #main-content:has(.about-author-links)
    > article
    > section.prose
    > hr:first-of-type
    ~ * {
    max-width: var(--huikai-entry-reading-measure);
  }

  /* The canonical author-links partial intentionally uses subdued neutral
     colors. On /about/ raise the base contrast one step so the links read as
     available controls rather than disabled decoration, while keeping theme
     hover colors intact. */
  .about-author-links > div {
    color: rgb(var(--color-neutral-500, 115 115 115));
  }

  .dark .about-author-links > div {
    color: rgb(var(--color-neutral-300, 212 212 212));
  }

  .about-author-links a:focus-visible {
    border-radius: 0.25rem;
    outline: 2px solid rgb(var(--color-primary-500, 59 130 246));
    outline-offset: 4px;
  }

  @media (max-width: 639.98px) {
    #main-content:has(.huikai-page-lead) > header h1,
    #main-content:has(.huikai-page-lead) > article > header h1 {
      margin-top: 1.5rem;
      font-size: 2.25rem;
    }

    .huikai-page-lead p {
      font-size: 1rem;
      line-height: 1.75;
    }

    .huikai-page-lead::after {
      margin-top: 1.5rem;
    }

    .huikai-page-lead:not(:last-child) {
      margin-bottom: 2rem;
    }
  }
</style>
